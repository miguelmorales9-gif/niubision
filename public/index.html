function openContract(planLabel) {
  const text = contractBody(planLabel);
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `<div class="sheet">
    <div class="handle"></div>
    <p class="tagline">Contrato</p>
    <h2>${planLabel}</h2>
    <pre class="contract">${text}</pre>
    <input class="field" id="sigName" placeholder="Nombre al firmar" value="${escAttr((state.health && state.health.name) || "")}">
    <p class="muted">Firme con el dedo en el recuadro.</p>
    <canvas id="sigPad" width="640" height="180"></canvas>
    <div class="work-tools">
      <button class="btn small ghost" id="clrSig">Borrar firma</button>
    </div>
    <label class="habit"><input type="checkbox" id="agree"> Leí el contrato y acepto este servicio. El cuestionario de salud ya está completo.</label>
    <button class="btn primary" id="signGo">Firmar</button>
    <button class="btn ghost" id="closeSheet">Cerrar</button>
  </div>`;
  document.body.appendChild(modal);
  const canvas = $("#sigPad");
  const ctx = canvas.getContext("2d");
  ctx.strokeStyle = "#f7f1e8"; ctx.lineWidth = 2; ctx.lineCap = "round";
  let draw = false, dirty = false;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const pt = e.touches ? e.touches[0] : e;
    return { x: (pt.clientX - r.left) * (canvas.width / r.width), y: (pt.clientY - r.top) * (canvas.height / r.height) };
  };
  const start = (e) => { e.preventDefault(); draw = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const move = (e) => { if (!draw) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); dirty = true; };
  const end = () => { draw = false; };
  canvas.addEventListener("pointerdown", start);
  canvas.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  $("#clrSig").onclick = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); dirty = false; };
  modal.querySelector("#closeSheet").onclick = () => modal.remove();
  $("#signGo").onclick = () => {
    if (!$("#agree").checked) return toast("Marque que acepta");
    const nm = cleanName($("#sigName").value);
    if (!nm) return toast("Escriba el nombre");
    if (!dirty) return toast("Firme en el recuadro");
    if (!healthComplete()) return toast("Complete primero el cuestionario");
    const rec = {
      id: "k" + Date.now(),
      plan: planLabel,
      name: nm,
      date: todayKey(),
      flagged: healthFlagged(),
      signature: canvas.toDataURL("image/png"),
      health: state.health
    };
    state.contracts.push(rec);
    const short = planLabel.includes("Base") ? "Base" : planLabel.includes("Premium") ? "Premium" : planLabel.includes("Estándar") ? "Estándar" : state.profile.plan;
    state.profile.plan = short;
    persist();
    modal.remove();
    toast("Contrato firmado");
    openPaySheet(planLabel);
  };
}

function beep(freq, ms) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.value = 0.05; o.connect(g); g.connect(ctx.destination);
    o.start(); setTimeout(() => { o.stop(); ctx.close(); }, ms || 180);
  } catch (e) {}
}

function bindWork() {
  const rt = activeRoutine();
  const saveFromDom = () => {
    const ses = loadSession(rt);
    ses.items.forEach((it, i) => it.sets.forEach((s, si) => {
      const w = $(`[data-w="${i}-${si}"]`);
      const r = $(`[data-r="${i}-${si}"]`);
      const d = $(`[data-d="${i}-${si}"]`);
      if (w) s.w = w.value; if (r) s.r = r.value; if (d) s.done = d.checked;
    }));
    store.set(sessionKey(rt), ses);
    saveLastLoads(ses);
    return ses;
  };
  $$("[data-d]").forEach((el) => el.onchange = () => {
    saveFromDom();
    el.closest(".set-row").classList.toggle("done", el.checked);
    if (el.checked) {
      beep(880, 120);
      if (navigator.vibrate) navigator.vibrate(30);
      startTimer(Number(el.closest(".work-ex").querySelector("[data-rest]").dataset.rest || 90));
    }
  });
  $$("[data-w], [data-r]").forEach((el) => el.onchange = saveFromDom);
  $$("[data-adj]").forEach((b) => b.onclick = () => {
    const [i, si, field, dir] = b.dataset.adj.split("-");
    const input = $(`[data-w="${i}-${si}"]`);
    if (!input) return;
    const cur = parseFloat(input.value || lastLoad(loadSession(rt).items[Number(i)].exId) || "0") || 0;
    input.value = String(Math.max(0, cur + (dir === "+" ? 5 : -5)));
    saveFromDom();
  });
  $$("[data-toggle]").forEach((el) => el.onclick = (e) => {
    if (e.target.dataset.open) { openExercise(e.target.dataset.open); return; }
    store.set("nb_open_ex", Number(el.dataset.toggle));
    render();
  });
  $$("[data-addset]").forEach((b) => b.onclick = () => {
    const ses = saveFromDom();
    const it = ses.items[Number(b.dataset.addset)];
    const prev = it.sets[it.sets.length - 1] || { w: "", r: "8", done: false };
    it.sets.push({ w: prev.w, r: prev.r, done: false });
    store.set(sessionKey(rt), ses);
    render();
  });
  $$("[data-rest]").forEach((el) => el.onclick = (e) => { e.preventDefault(); startTimer(Number(el.dataset.rest)); });
  $$("[data-video]").forEach((el) => el.onclick = (e) => {
    e.preventDefault();
    window.open(waLink(`Technique video: ${el.dataset.video}. ${state.profile.name || ""}`.trim()), "_blank");
  });
  const go = $("#start321");
  if (go) go.onclick = () => startCountdown();
  $("#finishDay").onclick = () => {
    const ses = saveFromDom();
    const doneSets = ses.items.reduce((n, it) => n + it.sets.filter((s) => s.done).length, 0);
    const total = ses.items.reduce((n, it) => n + it.sets.length, 0);
    state.history.push({ date: todayKey(), routine: rt.id, day: rt.daysPlan[dayIndex(rt) % rt.daysPlan.length].title, doneSets, total });
    persist();
    beep(520, 250);
    openDone(doneSets, total);
  };
  $("#nextDay").onclick = () => {
    setDayIndex(rt, dayIndex(rt) + 1);
    store.set("nb_open_ex", 0);
    toast("Siguiente día listo");
    render();
  };
  if (!state.sessStart) state.sessStart = Date.now();
  const tickSess = () => {
    const el = $("#sessClock");
    if (!el) { if (state.sessTick) clearInterval(state.sessTick); return; }
    const s = Math.floor((Date.now() - state.sessStart) / 1000);
    el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  };
  tickSess();
  if (state.sessTick) clearInterval(state.sessTick);
  state.sessTick = setInterval(tickSess, 1000);
}

function startCountdown() {
  let n = 3;
  const overlay = document.createElement("div");
  overlay.className = "modal";
  overlay.innerHTML = `<div class="sheet" style="text-align:center"><h2 id="cd" style="font-size:72px">3</h2><p class="muted">Prepárese</p></div>`;
  document.body.appendChild(overlay);
  beep(440, 120);
  const id = setInterval(() => {
    n -= 1;
    if (n <= 0) {
      clearInterval(id);
      overlay.querySelector("#cd").textContent = "GO";
      beep(880, 220);
      setTimeout(() => overlay.remove(), 400);
    } else {
      overlay.querySelector("#cd").textContent = String(n);
      beep(440, 120);
    }
  }, 800);
}

function startTimer(sec) {
  if (state.timer) clearInterval(state.timer.id);
  let left = sec;
  let el = $(".timer");
  if (!el) { el = document.createElement("button"); el.className = "timer"; document.body.appendChild(el); }
  const tick = () => {
    el.innerHTML = `${left}<small>pausa</small>`;
    if (left <= 0) {
      clearInterval(state.timer.id); el.remove(); state.timer = null;
      beep(760, 280); toast("Next set");
      if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
    }
    left -= 1;
  };
  tick();
  state.timer = { id: setInterval(tick, 1000) };
  el.onclick = () => { clearInterval(state.timer.id); el.remove(); state.timer = null; };
}

function studioKey() {

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    state.settings.studioKey = s;
    persist();
  }
  return state.settings.studioKey;
}
function clientCode(c) {
  return `NB2|${studioKey()}|${cleanName(c.name)}|${cleanName(c.plan)}|${String(c.routine || "").replace(/\|/g, "-").slice(0, 64)}`;
}
function parseClientCode(raw) {
  const t = (raw || "").trim().replace(/\s+/g, "");
  if (!t) return null;
  const p = t.split("|");
  if (p[0] === "NB2" && p.length >= 5) {
    const key = p[1];
    if (!/^[A-HJ-NP-Z2-9]{5}$/.test(key)) return null;
    if (state.settings.studioKey && key !== state.settings.studioKey) return null;
    if (!state.settings.studioKey) {
      state.settings.studioKey = key;
      state.settings.studioKeyFromClient = true;
      persist();
    }
    const routine = p.slice(4).join("|").slice(0, 64).replace(/[<>]/g, "");
    return { name: cleanName(p[2]), plan: cleanName(p[3]).slice(0, 40), routine };
  }
  return null;
}
function applyClientAssign(a) {
  if (!a) return false;
  state.role = "client";
  if (a.name) state.profile.name = a.name;
  if (a.plan) state.profile.plan = a.plan;
  if (a.routine) state.profile.routine = a.routine;
  state.profile.unlocked = true;
  persist();
  return true;
}
function copyText(text) {
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();
  area.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(area);
  if (ok) return Promise.resolve(true);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
  }
  return Promise.resolve(false);
}

function openDossier(filterName) {
  downloadTextPdf(filterName);
  const html = dossierHtml(filterName);

function pdfEscape(str) {
  const map = {
    "á": "\\341", "é": "\\351", "í": "\\355", "ó": "\\363", "ú": "\\372",
    "Á": "\\301", "É": "\\311", "Í": "\\315", "Ó": "\\323", "Ú": "\\332",
    "ñ": "\\361", "Ñ": "\\321", "ü": "\\374", "Ü": "\\334",
    "¿": "\\277", "¡": "\\241", "°": "\\260"
  };
  return String(str || "").split("").map((ch) => {
    if (map[ch]) return map[ch];
    if (ch === "\\" || ch === "(" || ch === ")") return "\\" + ch;
    const c = ch.charCodeAt(0);
    if (c === 8212 || c === 8211) return "-";
    if (c === 8220 || c === 8221) return '"';
    if (c >= 32 && c <= 126) return ch;
    if (c < 256) return "\\" + c.toString(8).padStart(3, "0");
    return " ";
  }).join("");
}
function wrapLine(s, max) {
  const out = [];
  let row = "";
  String(s || "").split(/\s+/).forEach((w) => {
    const next = row ? row + " " + w : w;
    if (next.length > max) { if (row) out.push(row); row = w; } else row = next;
  });
  if (row) out.push(row);
  if (!out.length) out.push("");
  return out;
}
function downloadTextPdf(filterName) {
  const want = (filterName || "").trim().toLowerCase();
  const match = (n) => !want || String(n || "").toLowerCase() === want;
  const lines = [];
  const add = (s) => wrapLine(s, 92).forEach((x) => lines.push(x));
  add("NIUBISION  —  EXPEDIENTE PARA ARCHIVO");
  add("Generado: " + todayKey());
  add("");
  add("1. CLIENTES");
  const clients = want ? state.clients.filter((c) => match(c.name)) : state.clients;
  if (!clients.length) add("Sin clientes en esta ficha.");
  clients.forEach((c) => {
    const rt = findRoutine(c.routine);
    add("Nombre: " + c.name);
    add("Plan: " + c.plan);
    add("Rutina: " + (rt ? rt.name : c.routine));
    add("Codigo de entrada: " + clientCode(c));
    add("");
  });
  add("2. RELEVO DE RESPONSABILIDAD");
  const w = state.waiver && match(state.waiver.name) ? state.waiver : (!want ? state.waiver : null);
  if (w) {
    add("Firmante: " + w.name);
    add("Fecha: " + w.date);
    add("Estado: firmado en la aplicacion.");
  } else add("No hay relevo guardado en este telefono para esta ficha.");
  add("");
  add("3. CUESTIONARIO DE SALUD");
  const h = state.health && match(state.health.name) ? state.health : (!want ? state.health : null);
  if (h) {
    add("Nombre: " + h.name);
    add("Fecha: " + h.date);
    add("Telefono: " + (h.phone || "—"));
    add("Contacto de emergencia: " + (h.emer || "—"));
    add("Autorizacion medica declarada: " + (h.clearance ? "si" : "no"));
    if (h.notes) add("Notas: " + h.notes);
    HEALTH_ITEMS.forEach((q, i) => add((i + 1) + ". [" + (h[q.id] || "—") + "] " + q.t));
  } else add("No hay cuestionario guardado en este telefono para esta ficha.");
  add("");
  add("4. CONTRATOS");
  const ks = (state.contracts || []).filter((k) => match(k.name));
  if (!ks.length) add("No hay contratos firmados en esta ficha.");
  ks.forEach((k) => {
    add("Cliente: " + k.name);
    add("Servicio: " + k.plan);
    add("Fecha de firma: " + k.date);
    add("Bandera de salud: " + (k.flagged ? "si" : "no"));
    add("");
  });
  add("Documento de archivo local. NiuBision.");

  const pages = [];
  let y = 760, buf = ["BT /F1 10 Tf"];
  const flush = () => { buf.push("ET"); pages.push(buf.join("\n")); buf = ["BT /F1 10 Tf"]; y = 760; };
  lines.forEach((ln) => {
    if (y < 50) flush();
    buf.push(`1 0 0 1 40 ${y} Tm (${pdfEscape(ln)}) Tj`);
    y -= 13;
  });
  flush();

  const fontId = 3 + pages.length * 2;
  const objs = [];
  objs[0] = "1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj";
  const kids = pages.map((_, i) => `${3 + i * 2} 0 R`).join(" ");
  objs[1] = `2 0 obj << /Type /Pages /Kids [${kids}] /Count ${pages.length} >> endobj`;
  pages.forEach((stream, i) => {
    const pageId = 3 + i * 2;
    const contId = pageId + 1;
    objs.push(`${pageId} 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents ${contId} 0 R /Resources << /Font << /F1 ${fontId} 0 R >> >> >> endobj`);
    objs.push(`${contId} 0 obj << /Length ${stream.length} >> stream\n${stream}\nendstream endobj`);
  });
  objs.push(`${fontId} 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >> endobj`);

  let pdf = "%PDF-1.4\n";
  const offs = [0];
  objs.forEach((o) => { offs.push(pdf.length); pdf += o + "\n"; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i < offs.length; i++) pdf += String(offs[i]).padStart(10, "0") + " 00000 n \n";
  pdf += `trailer << /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const blob = new Blob([pdf], { type: "application/pdf" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (filterName ? "ficha-" + filterName.replace(/\s+/g, "-") : "expediente-niubision") + ".pdf";
  a.click();
  toast("PDF descargado");
}

  if (addDay) addDay.onclick = () => {
    collectDraftFromDom();
    state.editDraft.daysPlan.push({ title: "New day", items: [{ name: "New exercise", sets: 3, reps: "8–10", rest: 90, exId: "" }] });
    render();
  };
  $("#cancelRt").onclick = () => { state.editDraft = null; render(); };
  $("#saveRt").onclick = () => {
    collectDraftFromDom();
    const d = JSON.parse(JSON.stringify(state.editDraft));
    const stockIds = (window.NBroutinesStock || []).map((r) => r.id);
    if (stockIds.includes(d.id)) state.routineEdits[d.id] = d;
    else {
      const i = state.customRoutines.findIndex((r) => r.id === d.id);
      if (i >= 0) state.customRoutines[i] = d;
      else state.customRoutines.push(d);
    }
    state.editDraft = null;
    persist();
    toast("Rutina guardada");
    render();
  };
}

function bindRoutinesCoach() {
  if (state.editDraft) return bindEditor();
  $$("[data-rt]").forEach((b) => b.onclick = () => openRoutine(b.dataset.rt));
  $$("[data-edit]").forEach((b) => b.onclick = () => {
    const r = findRoutine(b.dataset.edit);
    state.editDraft = JSON.parse(JSON.stringify(r));
    render();
  });
  $$("[data-del]").forEach((b) => b.onclick = () => {
    state.customRoutines = state.customRoutines.filter((r) => r.id !== b.dataset.del);
    persist(); render();
  });
  $("#newRt").onclick = () => {
    state.editDraft = {
      id: "rt-" + Date.now(),
      name: "Nueva rutina",
      days: 3, minutes: 45, level: "Inicio", place: "Gimnasio",
      goal: "",
      evidence: "Describa el criterio (frecuencia, volumen, población). Evite mitos.",
      daysPlan: [{ title: "Day A", items: [{ name: "Goblet Squat", sets: 3, reps: "8–10", rest: 90, exId: "Goblet_Squat" }] }]
    };
    render();
  };
  $("#uploadRt").onclick = () => $("#rtFile").click();
  $("#rtFile").onchange = () => {
    const f = $("#rtFile").files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        let data = JSON.parse(reader.result);
        const list = Array.isArray(data) ? data : [data];
        list.forEach((r) => {
          if (!r.id) r.id = "rt-" + Date.now();
          if (!r.daysPlan) throw new Error("falta daysPlan");
          state.customRoutines.push(r);
        });
        persist(); toast("Rutina cargada"); render();
      } catch { toast("JSON no válido"); }
    };
    reader.readAsText(f);
  };
}

function viewBody() {
  if (state.view === "home") return homeView();
  if (state.view === "work") return workView();
  if (state.view === "book") return libraryView();
  if (state.view === "price") return pricesView();
  if (state.view === "habit") return habitView();
  if (state.view === "rutinas") return routinesCoachView();
  return peopleView();
}
function viewOrder() {
  if (state.role === "coach") return ["home", "work", "rutinas", "book", "people"];
  if (state.role === "guest") return ["price"];
  return ["home", "work", "book", "habit", "price"];
}
let viewGen = 0;
function afterPaint() {
  $$("img").forEach((img) => { img.onerror = () => { img.style.opacity = ".35"; }; });
  if (state.view === "work") bindWork();
  if (state.view === "rutinas") bindRoutinesCoach();
  bindChrome();
}
function render() {
  if (state.role === "client" && !(state.profile && state.profile.unlocked)) {
    state.role = null;
  }
  if (state.role === "guest" && state.view !== "price") state.view = "price";
  document.body.classList.toggle("in-app", !!state.role);
  if (!state.role) return renderGate();
  const html = viewBody();
  const app = $("#app");
  const stage = $("#viewStage");
  const shell = app && app.querySelector(".app-header") && app.querySelector(".nav");
  if (!shell || !stage) {
    viewGen++;
    app.innerHTML = header() + `<main id="viewStage" class="view-stage enter fade">${html}</main>` + nav();
    state._lastView = state.view;
    afterPaint();
    return;
  }
  $$(".nav [data-view]").forEach((b) => b.classList.toggle("on", b.dataset.view === state.view));
  if (state._lastView === state.view) {
    stage.innerHTML = html;
    afterPaint();
    return;
  }
  const order = viewOrder();
  const a = order.indexOf(state._lastView);
  const b = order.indexOf(state.view);
  const dir = (a < 0 || b < 0 || b >= a) ? 1 : -1;
  const gen = ++viewGen;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) {
    stage.innerHTML = html;
    stage.className = "view-stage";
    state._lastView = state.view;
    afterPaint();
    return;
  }
  stage.className = "view-stage leave " + (dir > 0 ? "to-left" : "to-right");
  setTimeout(() => {
    if (gen !== viewGen) return;
    stage.innerHTML = html;
    stage.className = "view-stage enter " + (dir > 0 ? "from-right" : "from-left");
    state._lastView = state.view;
    afterPaint();
  }, 180);
}

async function boot() {
  applyHash();
  if (state.splash) warmupIntro();
  pinLocked();
  if (state.pin != null && state.pin !== "") state.pin = String(state.pin);
  if (state.role === "client" && !(state.profile && state.profile.unlocked)) {
    state.role = null;
  }
  const rename = { FORJA: "Estándar", "OS PREMIUM": "Premium", BASE: "Base", "NiuBision Base": "Base" };
  if (rename[state.profile.plan]) state.profile.plan = rename[state.profile.plan];
  state.clients.forEach((c) => { if (rename[c.plan]) c.plan = rename[c.plan]; });
  try {
    if (window.NBexercises && window.NBexercises.length) state.exercises = window.NBexercises;
    else {
      const res = await fetch("data/exercises.json");
      state.exercises = await res.json();
    }
  } catch (e) { state.exercises = window.NBexercises || []; }
  try { render(); }
  catch (err) {
    const el = document.getElementById("app");
    if (el) el.innerHTML = "<section class='screen'><h2>NiuBision</h2><p>Error al iniciar. Ábralo con Chrome.</p></section>";
    console.error(err);
  }
}
boot();

</script>
</body>
