<style>:root {
  --bg: #121018; --bg-2: #1b1a22; --bg-3: #24222c; --line: #2e2b36;
  --gold: #d4b06a; --gold-dim: #8a7344; --cream: #f7f1e8;
  --peach: #f3b184; --mint: #8fcbb3; --mute: #9a9488;
  --font: "Source Sans 3", "Segoe UI", sans-serif;
  --display: "Fraunces", Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--cream); font-family: var(--font); min-height: 100%; }
body { padding-bottom: 92px; }
button, input, select, textarea { font-family: inherit; color: inherit; }
img { max-width: 100%; display: block; }
a { color: var(--gold); }
.hidden { display: none !important; }
.app-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(18,16,24,.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 40px; height: 40px; border-radius: 0; object-fit: contain; background: transparent; }
.brand strong { font-size: 15px; letter-spacing: .04em; }
.brand span { display: block; color: var(--mute); font-size: 11px; }
.chip { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--gold-dim); color: var(--gold); padding: 6px 10px; border-radius: 999px; background: transparent; }
.screen { padding: 18px 16px 28px; max-width: 760px; margin: 0 auto; animation: rise .35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(212,176,106,.12); } }
.hero { text-align: center; padding: 36px 8px 12px; }
.hero img { width: 128px; height: 128px; margin: 0 auto 16px; border-radius: 28px; object-fit: cover; animation: pulse 2.6s ease-in-out infinite; }
.hero.cover img, .cover .logo-btn img, .cover .splash-logo {
  width: min(70vw, 240px); height: min(70vw, 240px);
  border-radius: 0 !important; object-fit: contain !important;
  background: transparent !important; animation: logoIdle 5.5s ease-in-out infinite;
}
.hero h1 { font-family: var(--display); font-weight: 500; font-size: 34px; }
.hero p { color: var(--mute); margin-top: 10px; font-size: 16px; line-height: 1.45; }
.tagline { color: var(--gold); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; margin-bottom: 8px; }
.card, .plan, .ex-card, .rt-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; }
.card, .plan { padding: 16px; margin-bottom: 12px; }
.card h3 { font-size: 17px; margin-bottom: 6px; }
.muted { color: var(--mute); font-size: 14px; line-height: 1.5; }
.price { font-family: var(--display); font-size: 32px; color: var(--gold); margin: 8px 0 4px; }
.price small { font-size: 14px; color: var(--mute); font-family: var(--font); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 14px; padding: 13px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--gold); color: #1a160f; }
.btn.ghost { background: transparent; color: var(--cream); border: 1px solid var(--line); }
.btn.mint { background: #24332e; color: var(--mint); }
.btn.small { width: auto; padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn + .btn { margin-top: 8px; }
.actions { margin-top: 14px; }
.row { display: grid; gap: 10px; }
.row.two { grid-template-columns: 1fr 1fr; }
.row.three { grid-template-columns: 1fr 1fr 1fr; }
.stat { text-align: center; padding: 14px 8px; }
.stat b { display: block; font-family: var(--display); font-size: 26px; color: var(--gold); }
.stat span { color: var(--mute); font-size: 12px; }
.search, select, textarea, .field { width: 100%; background: var(--bg-3); border: 1px solid var(--line); color: var(--cream); border-radius: 14px; padding: 12px 14px; font-size: 15px; margin-bottom: 10px; }
textarea { min-height: 80px; resize: vertical; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
.filters button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg-2); color: var(--mute); border-radius: 999px; padding: 7px 12px; font-size: 13px; }
.filters button.on { border-color: var(--gold); color: var(--gold); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ex-card { overflow: hidden; cursor: pointer; }
.ex-card img { width: 100%; height: 132px; object-fit: cover; background: #000; }
.ex-card .meta { padding: 10px 12px 12px; }
.ex-card h4 { font-size: 14px; line-height: 1.3; }
.pill { display: inline-block; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); margin-top: 4px; }
.progress { height: 8px; background: var(--bg-3); border-radius: 99px; overflow: hidden; margin: 10px 0 14px; }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--peach)); width: 0; transition: width .4s ease; }
.work-ex { padding: 0; overflow: hidden; margin-bottom: 12px; }
.work-ex header { display: flex; gap: 12px; padding: 12px; cursor: pointer; align-items: center; }
.work-ex header img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: #000; flex: 0 0 64px; }
.work-ex header h3 { font-size: 16px; }
.set-row { display: grid; grid-template-columns: 28px 1fr 1fr 36px; gap: 8px; align-items: center; padding: 6px 12px; }
.set-row input { margin: 0; padding: 8px; border-radius: 10px; text-align: center; }
.set-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--gold); justify-self: center; }
.set-row.done { opacity: .72; }
.set-row.done input[type=checkbox] { animation: pop .28s ease; }
.work-tools { display: flex; gap: 8px; padding: 10px 12px 14px; flex-wrap: wrap; }
.timer { position: fixed; right: 16px; bottom: 100px; z-index: 40; width: 76px; height: 76px; border-radius: 50%; background: var(--gold); color: #1a160f; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-direction: column; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
.timer small { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: #16141c; border-top: 1px solid var(--line); padding: 8px 4px 16px; }
.nav button { background: none; border: 0; color: var(--mute); font-size: 10px; letter-spacing: .03em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.nav button.on { color: var(--gold); }
.nav svg { width: 22px; height: 22px; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(8,7,12,.72); display: flex; align-items: flex-end; justify-content: center; animation: rise .2s ease; }
.sheet { background: var(--bg-2); width: min(720px, 100%); max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 16px 16px 32px; border: 1px solid var(--line); }
.handle { width: 42px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 14px; }
.sheet h2 { font-family: var(--display); font-size: 26px; margin-bottom: 8px; }
.demo-frame { position: relative; border-radius: 16px; overflow: hidden; background: #000; margin-bottom: 12px; }
.demo-frame img { width: 100%; height: 260px; object-fit: cover; }
.demo-badge { position: absolute; top: 10px; left: 10px; background: rgba(18,16,24,.8); color: var(--gold); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; }
.steps li { margin: 0 0 8px 18px; font-size: 14px; line-height: 1.45; }
.include { list-style: none; margin-top: 8px; }
.include li { position: relative; padding: 7px 0 7px 18px; font-size: 14px; }
.include li:before { content: ""; position: absolute; left: 0; top: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.plan.featured { border-color: var(--gold); }
.plan .eyebrow { color: var(--gold); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.compare { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; font-size: 12px; }
.compare div { padding: 8px 6px; border-bottom: 1px solid var(--line); }
.compare .h { color: var(--gold); font-weight: 600; }
.habit { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.habit input { width: 22px; height: 22px; accent-color: var(--gold); }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ok { color: var(--mint); } .warn { color: var(--peach); }
#toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: #2a261f; color: var(--cream); padding: 10px 14px; border-radius: 12px; z-index: 80; font-size: 14px; border: 1px solid var(--gold); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
#toast.show { opacity: 1; }
@media (min-width: 900px) {
  body { padding-bottom: 24px; }

elp push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.", "Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.", "Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.", "Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.", "Repeat the movement for the prescribed amount of repetitions.", "When you are done, place the dumbbells back on your thighs and then on the floor. This is the safest manner to release the dumbbells."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Incline_Dumbbell_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Incline_Dumbbell_Press/1.jpg"], "force": "push", "nameEs": "Press inclinado con mancuernas"}, {"id": "Dumbbell_Bench_Press", "name": "Dumbbell Bench Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Hombros", "Tríceps"], "instructions": ["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.", "Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.", "Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position.", "Then, as you breathe out, use your chest to push the dumbbells up. Lock your arms at the top of the lift and squeeze your chest, hold for a second and then begin coming down slowly. Tip: Ideally, lowering the weight should take about twice as long as raising it.", "Repeat the movement for the prescribed amount of repetitions of your training program."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bench_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bench_Press/1.jpg"], "force": "push", "nameEs": "Press de banca con mancuernas"}, {"id": "Standing_Military_Press", "name": "Standing Military Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Tríceps"], "instructions": ["Start by placing a barbell that is about chest high on a squat rack. Once you have selected the weights, grab the barbell using a pronated (palms facing forward) grip. Make sure to grip the bar wider than shoulder width apart from each other.", "Slightly bend the knees and place the barbell on your collar bone. Lift the barbell up keeping it lying on your chest. Take a step back and position your feet shoulder width apart from each other.", "Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.", "Lower the bar down to the collarbone slowly as you inhale.", "Lift the bar back up to the starting position as you exhale.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Military_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Military_Press/1.jpg"], "force": "push", "nameEs": "Press militar"}, {"id": "Dumbbell_Shoulder_Press", "name": "Dumbbell Shoulder Press", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Tríceps"], "instructions": ["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.", "Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.", "Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position.", "Now, exhale and push the dumbbells upward until they touch at the top.", "Then, after a brief pause at the top contracted position, slowly lower the weights back down to the starting position while inhaling.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Shoulder_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Shoulder_Press/1.jpg"], "force": "push", "nameEs": "Press de hombros con mancuernas"}, {"id": "Barbell_Curl", "name": "Barbell Curl", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["biceps"], "musclesEs": ["Bíceps"], "secondaryEs": ["Antebrazos"], "instructions": ["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.", "While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.", "Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.", "Slowly begin to bring the bar back to starting position as your breathe in.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Curl/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Curl/1.jpg"], "force": "pull", "nameEs": "Curl de bíceps con barra"}, {"id": "Hammer_Curls", "name": "Hammer Curls", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["biceps"], "musclesEs": ["Bíceps"], "secondaryEs": [], "instructions": ["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.", "The palms of the hands should be facing your torso. This will be your starting position.", "Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.", "After the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hammer_Curls/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hammer_Curls/1.jpg"], "force": "pull", "nameEs": "Curl martillo"}, {"id": "Triceps_Pushdown", "name": "Triceps Pushdown", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": r body back to the starting position.", "Repeat the movement for the prescribed amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dips_-_Triceps_Version/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dips_-_Triceps_Version/1.jpg"], "force": "push", "nameEs": "Fondos de tríceps"}, {"id": "Pullups", "name": "Pullups", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["lats"], "musclesEs": ["Dorsales"], "secondaryEs": ["Bíceps", "Espalda media"], "instructions": ["Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.", "As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.", "Pull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.", "After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.", "Repeat this motion for the prescribed amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pullups/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pullups/1.jpg"], "force": "pull", "nameEs": "Dominadas"}, {"id": "Wide-Grip_Lat_Pulldown", "name": "Wide-Grip Lat Pulldown", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["lats"], "musclesEs": ["Dorsales"], "secondaryEs": ["Bíceps", "Espalda media", "Hombros"], "instructions": ["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.", "As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.", "As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.", "After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.", "Repeat this motion for the prescribed amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Wide-Grip_Lat_Pulldown/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Wide-Grip_Lat_Pulldown/1.jpg"], "force": "pull", "nameEs": "Jalón al pecho agarre abierto"}, {"id": "Bent_Over_Barbell_Row", "name": "Bent Over Barbell Row", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["middle back"], "musclesEs": ["Espalda media"], "secondaryEs": ["Bíceps", "Dorsales", "Hombros"], "instructions": ["Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.", "Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.", "Then inhale and slowly lower the barbell back to the starting position.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Barbell_Row/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Barbell_Row/1.jpg"], "force": "pull", "nameEs": "Remo con barra"}, {"id": "One-Arm_Dumbbell_Row", "name": "One-Arm Dumbbell Row", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["middle back"], "musclesEs": ["Espalda media"], "secondaryEs": ["Bíceps", "Dorsales", "Hombros"], "instructions": ["Choose a flat bench and place a dumbbell on each side of it.", "Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.", "Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.", "Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.", "Lower the resistance straight down to the starting position. Breathe in as you perform this step.", "Repeat the movement for the specified amount of repetitions.", "Switch sides and repeat again with the other arm."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/One-Arm_Dumbbell_Row/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/One-Arm_Dumbbell_Row/1.jpg"], "force": "pull", "nameEs": "Remo con mancuerna a un brazo"}, {"id": "Seated_Cable_Rows", "name": "Seated Cable Rows", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["middle back"], "musclesEs": ["Espalda media"], "secondaryEs": ["Bíceps", "Dorsales", "Hombros"], "instructions": ["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.", "Lean over as you keep the natural alignment of your back and grab the V-bar handles.", "With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.", "Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Seated_Cable_Rows/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Seated_Cable_Rows/1.jpg"], "force": "pull", "nameEs": "Remo en polea sentado"}, {"id": "Face_Pull", "name": "Face Pull", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Espalda media"], "instructions": ["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Face_Pull/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Face_Pull/1.jpg"], "force": "pull", "nameEs": "Face pull"}, {"id": "Side_Lateral_Raise", "name": "Side Lateral Raise", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": [], "instructions": ["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.", "While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.", "Lower the dumbbells back down slowly to the starting position as you inhale.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Side_Lateral_Raise/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Side_Lateral_Raise/1.jpg"], "force": "push", "nameEs": "Elevación lateral"}, {"id": "Front_Dumbbell_Raise", "name": "Front Dumbbell Raise", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": [], "instructions": ["Pick a couple of dumbbells and stand with a straight torso and the dumbbells on front of your thighs at arms length with the palms of the hand facing your thighs. This will be your starting position.", "While maintaining the torso stationary (no swinging), lift the left dumbbell to the front with a slight bend on the elbow and the palms of the hands always facing down. Continue to go up until you arm is slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top. Inhale after the second pause.", "Now lower the dumbbell back down slowly to the starting position as you simultaneously lift the right dumbbell.", "Continue alternating in this fashion until all of the recommended amount of repetitions have been performed for each arm."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Front_Dumbbell_Raise/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Front_Dumbbell_Raise/1.jpg"], "force": "push", "nameEs": "Elevación frontal con mancuernas"}, {"id": "Romanian_Deadlift", "name": "Romanian Deadlift", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["hamstrings"], "musclesEs": ["Isquiotibiales"], "secondaryEs": ["Pantorrillas", "Glúteos", "Zona lumbar"], "instructions": ["Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.", "Bend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.", "Keeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.", "Once you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Romanian_Deadlift/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Romanian_Deadlift/1.jpg"], "force": "pull", "nameEs": "Peso muerto rumano"}, {"id": "Stiff-Legged_Barbell_Deadlift", "name": "Stiff-Legged Barbell Deadlift", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["hamstrings"], "musclesEs": ["Isquiotibiales"], "secondaryEs": ["Glúteos", "Zona lumbar"], "instructions": ["Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight.", "Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.", "Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the hips while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Inhale as you perform this movement.", "Start bringing your torso up straight again by extending your hips until you are back at the starting position. Exhale as you perform this movement.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Stiff-Legged_Barbell_Deadlift/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Stiff-Legged_Barbell_Deadlift/1.jpg"], "force": "pull", "nameEs": "Peso muerto piernas rígidas"}, {"id": "Leg_Press", "name": "Leg Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Glúteos", "Isquiotibiales"], "instructions": ["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).", "Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.", "As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.", "Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.", "Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Press/1.jpg"], "force": "push", "nameEs": "Prensa de piernas"}, {"id": "Barbell_Lunge", "name": "Barbell Lunge", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Glúteos", "Isquiotibiales"], "instructions": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>", "Using mainly the heel of your foot, push up and go back to the starting position as you exhale.", "Repeat the movement for the recommended amount of repetitions and then perform with the left leg."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Lunge/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Lunge/1.jpg"], "force": "push", "nameEs": "Zancada con barra"}, {"id": "Lying_Leg_Curls", "name": "Lying Leg Curls", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["hamstrings"], "musclesEs": ["Isquiotibiales"], "secondaryEs": [], "instructions": ["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.", "Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.", "As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.", "As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Lying_Leg_Curls/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Lying_Leg_Curls/1.jpg"], "force": "pull", "nameEs": "Curl femoral tumbado"}, {"id": "Leg_Extensions", "name": "Leg Extensions", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": [], "instructions": ["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.", "Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.", "Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.", "Repeat for the recommended amount of times."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Extensions/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Extensions/1.jpg"], "force": "push", "nameEs": "Extensión de cuádriceps"}, {"id": "Standing_Calf_Raises", "name": "Standing Calf Raises", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["calves"], "musclesEs": ["Pantorrillas"], "secondaryEs": [], "instructions": ["Adjust the padded lever of the calf raise machine to fit your height.", "Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.", "Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.", "Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Calf_Raises/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Calf_Raises/1.jpg"], "force": "push", "nameEs": "Elevación de talones"}, {"id": "Plank", "name": "Plank", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.", "Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/1.jpg"], "force": "static", "nameEs": "Plancha"}, {"id": "Crunches", "name": "Crunches", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Lie flat on your back with your feet flat on the ground, or resting on a bench with your knees bent at a 90 degree angle. If you are resting your feet on a bench, place them three to four inches apart and point your toes inward so they touch.", "Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.", "While pushing the small of your back down in the floor to better isolate your abdominal muscles, begin to roll your shoulders off the floor.", "Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the floor only about four inches, and your lower back should remain on the floor. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum.", "After the one second contraction, begin to come down slowly again to the starting position as you inhale.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Crunches/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Crunches/1.jpg"], "force": "pull", "nameEs": "Crunch"}, {"id": "Hanging_Leg_Raise", "name": "Hanging Leg Raise", "level": "expert", "levelEs": "Avanzado", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Hang from a chin-up bar with both arms extended at arms length in top of you using either a wide grip or a medium grip. The legs should be straight down with the pelvis rolled slightly backwards. This will be your starting position.", "Raise your legs until the torso makes a 90-degree angle with the legs. Exhale as you perform this movement and hold the contraction for a second or so.", "Go back slowly to the starting position as you breathe in.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hanging_Leg_Raise/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hanging_Leg_Raise/1.jpg"], "force": "pull", "nameEs": "Elevación de piernas colgado"}, {"id": "Air_Bike", "name": "Air Bike", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put your hands beside your head. Be careful however to not strain with the neck as you perform it. Now lift your shoulders into the crunch position.", "Bring knees up to where they are perpendicular to the floor, with your lower legs parallel to the floor. This will be your starting position.", "Now simultaneously, slowly go through a cycle pedal motion kicking forward with the right leg and bringing in the knee of the left leg. Bring your right elbow close to your left knee by crunching to the side, as you breathe out.", "Go back to the initial position as you breathe in.", "Crunch to the opposite side as you cycle your legs and bring closer your left elbow to your right knee and exhale.", "Continue alternating in this manner until all of the recommended repetitions for each side have been completed."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Air_Bike/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Air_Bike/1.jpg"], "force": "pull", "nameEs": "Bicicleta abdominal"}, {"id": "Mountain_Climbers", "name": "Mountain Climbers", "level": "beginner", "levelEs": "Inicio", "category": "plyometrics", "categoryEs": "Pliometría", "equipment": null, "equipmentEs": "Ninguno", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pecho", "Isquiotibiales", "Hombros"], "instructions": ["Begin in a pushup position, with your weight supported by your hands and toes. Flexing the knee and hip, bring one leg until the knee is approximately under the hip. This will be your starting position.", "Explosively reverse the positions of your legs, extending the bent leg until the leg is straight and supported by the toe, and bringing the other foot up with the hip and knee flexed. Repeat in an alternating fashion for 20-30 seconds."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Mountain_Climbers/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Mountain_Climbers/1.jpg"], "force": "pull", "nameEs": "Escalador"}, {"id": "Pushups", "name": "Pushups", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Hombros", "Tríceps"], "instructions": ["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.", "Next, lower yourself downward until your chest almost touches the floor as you inhale.", "Now breathe out and press your upper body back up to the starting position while squeezing your chest.", "After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pushups/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pushups/1.jpg"], "force": "push", "nameEs": "Flexiones"}, {"id": "Decline_Push-Up", "name": "Decline Push-Up", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": null, "equipmentEs": "Ninguno", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Hombros", "Tríceps"], "instructions": ["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length. Move your feet up to a box or bench. This will be your starting position.", "Next, lower yourself downward until your chest almost touches the floor as you inhale.", "Now breathe out and press your upper body back up to the starting position while squeezing your chest.", "After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Decline_Push-Up/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Decline_Push-Up/1.jpg"], "force": "push", "nameEs": "Flexión declinada"}, {"id": "Bodyweight_Squat", "name": "Bodyweight Squat", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Glúteos", "Isquiotibiales"], "instructions": ["Stand with your feet shoulder width apart. You can place your hands behind your head. This will be your starting position.", "Begin the movement by flexing your knees and hips, sitting back with your hips.", "Continue down to full depth if you are able,and quickly reverse the motion until you return to the starting position. As you squat, keep your head and chest up and push your knees out."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bodyweight_Squat/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bodyweight_Squat/1.jpg"], "force": "push", "nameEs": "Sentadilla con peso corporal"}, {"id": "Goblet_Squat", "name": "Goblet Squat", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "kettlebells", "equipmentEs": "Pesa rusa", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Glúteos", "Isquiotibiales", "Hombros"], "instructions": ["Stand holding a light kettlebell by the horns close to your chest. This will be your starting position.", "Squat down between your legs until your hamstrings are on your calves. Keep your chest and head up and your back straight.", "At the bottom position, pause and use your elbows to push your knees out. Return to the starting position, and repeat for 10-20 repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Goblet_Squat/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Goblet_Squat/1.jpg"], "force": "push", "nameEs": "Sentadilla goblet"}, {"id": "Russian_Twist", "name": "Russian Twist", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": ["Zona lumbar"], "instructions": ["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.", "Elevate your upper body so that it creates an imaginary V-shape with your thighs. Your arms should be fully extended in front of you perpendicular to your torso and with the hands clasped. This is the starting position.", "Twist your torso to the right side until your arms are parallel with the floor while breathing out.", "Hold the contraction for a second and move back to the starting position while breathing out. Now move to the opposite side performing the same techniques you applied to the right side.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Russian_Twist/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Russian_Twist/1.jpg"], "force": "pull", "nameEs": "Giro ruso"}, {"id": "Superman", "name": "Superman", "level": "beginner", "levelEs": "Inicio", "category": "stretching", "categoryEs": "Movilidad", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["lower back"], "musclesEs": ["Zona lumbar"], "secondaryEs": ["Glúteos", "Isquiotibiales"], "instructions": ["To begin, lie straight and face down on the floor or exercise mat. Your arms should be fully extended in front of you. This is the starting position.", "Simultaneously raise your arms, legs, and chest off of the floor and hold this contraction for 2 seconds. Tip: Squeeze your lower back to get the best results from this exercise. Remember to exhale during this movement. Note: When holding the contracted position, you should look like superman when he is flying.", "Slowly begin to lower your arms, legs and chest back down to the starting position while inhaling.", "Repeat for the recommended amount of repetitions prescribed in your program."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Superman/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Superman/1.jpg"], "force": "static", "nameEs": "Superman"}, {"id": "Hyperextensions_Back_Extensions", "name": "Hyperextensions (Back Extensions)", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "other", "equipmentEs": "Otro", "muscles": ["lower back"], "musclesEs": ["Zona lumbar"], "secondaryEs": ["Glúteos", "Isquiotibiales"], "instructions": ["Lie face down on a hyperextension bench, tucking your ankles securely under the footpads.", "Adjust the upper pad if possible so your upper thighs lie flat across the wide pad, leaving enough room for you to bend at the waist without any restriction.", "With your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.", "Start bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you feel a nice stretch on the hamstrings and you can no longer keep going without a rounding of the back. Tip: Never round the back as you perform this exercise. Also, some people can go farther than others. The key thing is that you go as far as your body allows you to without rounding the back.", "Slowly raise your torso back to the initial position as you inhale. Tip: Avoid the temptation to arch your back past a straight line. Also, do not swing the torso at any time in order to protect the back from injury.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hyperextensions_Back_Extensions/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hyperextensions_Back_Extensions/1.jpg"], "force": "pull", "nameEs": "Hiperextensión lumbar"}, {"id": "Good_Morning", "name": "Good Morning", "level": "intermediate", "levelEs": "Intermedio", "category": "powerlifting", "categoryEs": "Powerlifting", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["hamstrings"], "musclesEs": ["Isquiotibiales"], "secondaryEs": ["Abdominales", "Glúteos", "Zona lumbar"], "instructions": ["Begin with a bar on a rack at shoulder height. Rack the bar across the rear of your shoulders as you would a power squat, not on top of your shoulders. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Step back from the rack.", "Begin by bending at the hips, moving them back as you bend over to near parallel. Keep your back arched and your cervical spine in proper alignment.", "Reverse the motion by extending through the hips with your glutes and hamstrings. Continue until you have returned to the starting position."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Good_Morning/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Good_Morning/1.jpg"], "force": "push", "nameEs": "Good morning"}, {"id": "Cable_Crunch", "name": "Cable Crunch", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Kneel below a high pulley that contains a rope attachment.", "Grasp cable rope attachment and lower the rope until your hands are placed next to your face.", "Flex your hips slightly and allow the weight to hyperextend the lower back. This will be your starting position.", "With the hips stationary, flex the waist as you contract the abs so that the elbows travel towards the middle of the thighs. Exhale as you perform this portion of the movement and hold the contraction for a second.", "Slowly return to the starting position as you inhale. Tip: Make sure that you keep constant tension on the abs throughout the movement. Also, do not choose a weight so heavy that the lower back handles the brunt of the work.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Crunch/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Crunch/1.jpg"], "force": "pull", "nameEs": "Crunch en polea"}, {"id": "Donkey_Calf_Raises", "name": "Donkey Calf Raises", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "other", "equipmentEs": "Otro", "muscles": ["calves"], "musclesEs": ["Pantorrillas"], "secondaryEs": [], "instructions": ["For this exercise you will need access to a donkey calf raise machine. Start by positioning your lower back and hips under the padded lever provided. The tailbone area should be the one making contact with the pad.", "Place both of your arms on the side handles and place the balls of your feet on the calf block with the heels extending off. Align the toes forward, inward or outward, depending on the area you wish to target, and straighten the knees without locking them. This will be your starting position.", "Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.", "Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Donkey_Calf_Raises/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Donkey_Calf_Raises/1.jpg"], "force": "push", "nameEs": "Donkey Calf Raises"}, {"id": "Farmers_Walk", "name": "Farmer's Walk", "level": "intermediate", "levelEs": "Intermedio", "category": "strongman", "categoryEs": "Strongman", "equipment": "other", "equipmentEs": "Otro", "muscles": ["forearms"], "musclesEs": ["Antebrazos"], "secondaryEs": ["Abdominales", "Glúteos", "Isquiotibiales", "Zona lumbar", "Cuádriceps", "Trapecios"], "instructions": ["There are various implements that can be used for the farmers walk. These can also be performed with heavy dumbbells or short bars if these implements aren't available. Begin by standing between the implements.", "After gripping the handles, lift them up by driving through your heels, keeping your back straight and your head up.", "Walk taking short, quick steps, and don't forget to breathe. Move for a given distance, typically 50-100 feet, as fast as possible."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Farmers_Walk/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Farmers_Walk/1.jpg"], "force": null, "nameEs": "Paseo del granjero"}, {"id": "Box_Jump_Multiple_Response", "name": "Box Jump (Multiple Response)", "level": "beginner", "levelEs": "Inicio", "category": "plyometrics", "categoryEs": "Pliometría", "equipment": "other", "equipmentEs": "Otro", "muscles": ["hamstrings"], "musclesEs": ["Isquiotibiales"], "secondaryEs": ["Abductores", "Aductores", "Pantorrillas", "Glúteos", "Cuádriceps"], "instructions": ["Assume a relaxed stance facing the box or platform approximately an arm's length away. Arms should be down at the sides and legs slightly bent.", "Using the arms to aid in the initial burst, jump upward and forward, landing with feet simultaneously on top of the box or platform.", "Immediately drop or jump back down to the original starting place; then repeat the sequence."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Box_Jump_Multiple_Response/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Box_Jump_Multiple_Response/1.jpg"], "force": "push", "nameEs": "Box Jump (Multiple Response)"}, {"id": "Bodyweight_Walking_Lunge", "name": "Bodyweight Walking Lunge", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": null, "equipmentEs": "Ninguno", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Glúteos", "Isquiotibiales"], "instructions": ["Begin standing with your feet shoulder width apart and your hands on your hips.", "Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.", "Drive through the heel of your lead foot and extend both knees to raise yourself back up.", "Step forward with your rear foot, repeating the lunge on the opposite leg."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bodyweight_Walking_Lunge/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bodyweight_Walking_Lunge/1.jpg"], "force": "push", "nameEs": "Bodyweight Walking Lunge"}, {"id": "Dumbbell_Flyes", "name": "Dumbbell Flyes", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": [], "instructions": ["Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.", "Then using your thighs to help raise the dumbbells, lift the dumbbells one at a time so you can hold them in front of you at shoulder width with the palms of your hands facing each other. Raise the dumbbells up like you're pressing them, but stop and hold just before you lock out. This will be your starting position.", "With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.", "Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.", "Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Flyes/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Flyes/1.jpg"], "force": "push", "nameEs": "Aperturas con mancuernas"}, {"id": "Arnold_Dumbbell_Press", "name": "Arnold Dumbbell Press", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Tríceps"], "instructions": ["Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.", "Now to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.", "Continue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.", "After a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Arnold_Dumbbell_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Arnold_Dumbbell_Press/1.jpg"], "force": "push", "nameEs": "Press Arnold"}, {"id": "Upright_Barbell_Row", "name": "Upright Barbell Row", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Trapecios"], "instructions": ["Grasp a barbell with an overhand grip that is slightly less than shoulder width. The bar should be resting on the top of your thighs with your arms extended and a slight bend in your elbows. Your back should also be straight. This will be your starting position.", "Now exhale and use the sides of your shoulders to lift the bar, raising your elbows up and to the side. Keep the bar close to your body as you raise it. Continue to lift the bar until it nearly touches your chin. Tip: Your elbows should drive the motion, and should always be higher than your forearms. Remember to keep your torso stationary and pause for a second at the top of the movement.", "Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Upright_Barbell_Row/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Upright_Barbell_Row/1.jpg"], "force": "pull", "nameEs": "Upright Barbell Row"}, {"id": "Bent_Over_Two-Dumbbell_Row", "name": "Bent Over Two-Dumbbell Row", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["middle back"], "musclesEs": ["Espalda media"], "secondaryEs": ["Bíceps", "Dorsales", "Hombros"], "instructions": ["With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.", "While keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.", "Slowly lower the weight again to the starting position as you inhale.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Two-Dumbbell_Row/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Two-Dumbbell_Row/1.jpg"], "force": "pull", "nameEs": "Bent Over Two-Dumbbell Row"}, {"id": "Chin-Up", "name": "Chin-Up", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["lats"], "musclesEs": ["Dorsales"], "secondaryEs": ["Bíceps", "Antebrazos", "Espalda media"], "instructions": ["Grab the pull-up bar with the palms facing your torso and a grip closer than the shoulder width.", "As you have both arms extended in front of you holding the bar at the chosen grip width, keep your torso as straight as possible while creating a curvature on your lower back and sticking your chest out. This is your starting position. Tip: Keeping the torso as straight as possible maximizes biceps stimulation while minimizing back involvement.", "As you breathe out, pull your torso up until your head is around the level of the pull-up bar. Concentrate on using the biceps muscles in order to perform the movement. Keep the elbows close to your body. Tip: The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.", "After a second of squeezing the biceps in the contracted position, slowly lower your torso back to the starting position; when your arms are fully extended. Breathe in as you perform this portion of the movement.", "Repeat this motion for the prescribed amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Chin-Up/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Chin-Up/1.jpg"], "force": "pull", "nameEs": "Dominada supina"}, {"id": "Straight-Arm_Pulldown", "name": "Straight-Arm Pulldown", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["lats"], "musclesEs": ["Dorsales"], "secondaryEs": [], "instructions": ["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.", "Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.", "While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.", "While keeping the arms straight, go back to the starting position while breathing in.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Straight-Arm_Pulldown/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Straight-Arm_Pulldown/1.jpg"], "force": "pull", "nameEs": "Straight-Arm Pulldown"}, {"id": "Cable_Rope_Overhead_Triceps_Extension", "name": "Cable Rope Overhead Triceps Extension", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["triceps"], "musclesEs": ["Tríceps"], "secondaryEs": [], "instructions": ["Attach a rope to the bottom pulley of the pulley machine.", "Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.", "Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.", "Return to the starting position by flexing your triceps as you breathe out.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Rope_Overhead_Triceps_Extension/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Rope_Overhead_Triceps_Extension/1.jpg"], "force": "push", "nameEs": "Cable Rope Overhead Triceps Extension"}, {"id": "Concentration_Curls", "name": "Concentration Curls", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["biceps"], "musclesEs": ["Bíceps"], "secondaryEs": ["Antebrazos"], "instructions": ["Sit down on a flat bench with one dumbbell in front of you between your legs. Your legs should be spread with your knees bent and feet on the floor.", "Use your right arm to pick the dumbbell up. Place the back of your right upper arm on the top of your inner right thigh. Rotate the palm of your hand until it is facing forward away from your thigh. Tip: Your arm should be extended and the dumbbell should be above the floor. This will be your starting position.", "While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: At the top of the movement make sure that the little finger of your arm is higher than your thumb. This guarantees a good contraction. Hold the contracted position for a second as you squeeze the biceps.", "Slowly begin to bring the dumbbells back to starting position as your breathe in. Caution: Avoid swinging motions at any time.", "Repeat for the recommended amount of repetitions. Then repeat the movement with the left arm."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Concentration_Curls/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Concentration_Curls/1.jpg"], "force": "pull", "nameEs": "Curl concentrado"}, {"id": "Preacher_Curl", "name": "Preacher Curl", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["biceps"], "musclesEs": ["Bíceps"], "secondaryEs": [], "instructions": ["To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.", "With the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.", "As you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.", "As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Preacher_Curl/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Preacher_Curl/1.jpg"], "force": "pull", "nameEs": "Curl predicador"}, {"id": "Incline_Dumbbell_Curl", "name": "Incline Dumbbell Curl", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["biceps"], "musclesEs": ["Bíceps"], "secondaryEs": [], "instructions": ["Sit back on an incline bench with a dumbbell in each hand held at arms length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.", "While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second.", "Slowly begin to bring the dumbbells back to starting position as your breathe in.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Incline_Dumbbell_Curl/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Incline_Dumbbell_Curl/1.jpg"], "force": "pull", "nameEs": "Incline Dumbbell Curl"}, {"id": "Seated_Dumbbell_Press", "name": "Seated Dumbbell Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Tríceps"], "instructions": ["Grab a couple of dumbbells and sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs.", "Clean the dumbbells up one at a time by using your thighs to bring the dumbbells up to shoulder height at each side.", "Rotate the wrists so that the palms of your hands are facing forward. This is your starting position.", "As you exhale, push the dumbbells up until they touch at the top.", "After a second pause, slowly come down back to the starting position as you inhale.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Seated_Dumbbell_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Seated_Dumbbell_Press/1.jpg"], "force": "push", "nameEs": "Seated Dumbbell Press"}, {"id": "Sumo_Deadlift", "name": "Sumo Deadlift", "level": "intermediate", "levelEs": "Intermedio", "category": "powerlifting", "categoryEs": "Powerlifting", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["hamstrings"], "musclesEs": ["Isquiotibiales"], "secondaryEs": ["Aductores", "Antebrazos", "Glúteos", "Zona lumbar", "Espalda media", "Cuádriceps", "Trapecios"], "instructions": ["Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.", "Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, wi
