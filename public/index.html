th your weight on the back half of your feet. Extend through the hips and knees.", "As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.", "Return the weight to the ground by bending at the hips and controlling the weight on the way down."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Sumo_Deadlift/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Sumo_Deadlift/1.jpg"], "force": "pull", "nameEs": "Peso muerto sumo"}, {"id": "Trap_Bar_Deadlift", "name": "Trap Bar Deadlift", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "other", "equipmentEs": "Otro", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Glúteos", "Isquiotibiales"], "instructions": ["For this exercise load a trap bar, also known as a hex bar, to an appropriate weight resting on the ground. Stand in the center of the apparatus and grasp both handles.", "Lower your hips, look forward with your head and keep your chest up.", "Begin the movement by driving through the heels and extend your hips and knees. Avoid rounding your back at all times.", "At the completion of the movement, lower the weight back to the ground under control."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Trap_Bar_Deadlift/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Trap_Bar_Deadlift/1.jpg"], "force": "pull", "nameEs": "Trap Bar Deadlift"}, {"id": "Cable_Hip_Adduction", "name": "Cable Hip Adduction", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": [], "instructions": ["Stand in front of a low pulley facing forward with one leg next to the pulley and the other one away.", "Attach the ankle cuff to the cable and also to the ankle of the leg that is next to the pulley.", "Now step out and away from the stack with a wide stance and grasp the bar of the pulley system.", "Stand on the foot that does not have the ankle cuff (the far foot) and allow the leg with the cuff to be pulled towards the low pulley. This will be your starting position.", "Now perform the movement by moving the leg with the ankle cuff in front of the far leg by using the inner thighs to abduct the hip. Breathe out during this portion of the movement.", "Slowly return to the starting position as you breathe in.", "Repeat for the recommended amount of repetitions and then repeat the same movement with the opposite leg."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Hip_Adduction/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Hip_Adduction/1.jpg"], "force": "pull", "nameEs": "Cable Hip Adduction"}, {"id": "Frog_Sit-Ups", "name": "Frog Sit-Ups", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Lie with your back flat on the floor (or exercise mat) and your legs extended in front of you.", "Now bend at the knees and place your outer thighs by the floor (or mat) as you make the soles of your feet touch each other.", "Now try pushing both soles and bringing them up as near you as possible while you keep the outer thighs on the floor (or at least almost touching it). Tip: In this position your legs should create a diamond shape.", "Now, cross your arms in front of you by touching the opposite shoulders. This will be your starting position.", "As you exhale flatten your lower back to the floor while curling the torso upwards. Tip: This will be like performing the first 1/4 movement of a sit up. Hold at the top position for a second.", "As you inhale, slowly lower back to the starting position.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Frog_Sit-Ups/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Frog_Sit-Ups/1.jpg"], "force": "pull", "nameEs": "Frog Sit-Ups"}, {"id": "Dead_Bug", "name": "Dead Bug", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Begin lying on your back with your hands extended above you toward the ceiling.", "Bring your feet, knees, and hips up to 90 degrees.", "Exhale hard to bring your ribcage down and flatten your back onto the floor, rotating your pelvis up and squeezing your glutes. Hold this position throughout the movement. This will be your starting position.", "Initiate the exercise by extending one leg, straightening the knee and hip to bring the leg just above the ground.", "Maintain the position of your lumbar and pelvis as you perform the movement, as your back is going to want to arch.", "Stay tight and return the working leg to the starting position.", "Repeat on the opposite side, alternating until the set is complete."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dead_Bug/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dead_Bug/1.jpg"], "force": "pull", "nameEs": "Dead Bug"}, {"id": "Hanging_Pike", "name": "Hanging Pike", "level": "expert", "levelEs": "Avanzado", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Hang from a chin-up bar with your legs and feet together using an overhand grip (palms facing away from you) that is slightly wider than shoulder width. Tip: You may use wrist wraps in order to facilitate holding on to the bar.", "Now bend your knees at a 90 degree angle and bring the upper legs forward so that the calves are perpendicular to the floor while the thighs remain parallel to it. This will be your starting position.", "Pull your legs up as you exhale until you almost touch your shins with the bar above you. Tip: Try to straighten your legs as much as possible while at the top.", "Lower your legs as slowly as possible until you reach the starting position. Tip: Avoid swinging and using momentum at all times.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hanging_Pike/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hanging_Pike/1.jpg"], "force": "pull", "nameEs": "Hanging Pike"}, {"id": "Ab_Crunch_Machine", "name": "Ab Crunch Machine", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Select a light resistance and sit down on the ab machine placing your feet under the pads provided and grabbing the top handles. Your arms should be bent at a 90 degree angle as you rest the triceps on the pads provided. This will be your starting position.", "At the same time, begin to lift the legs up as you crunch your upper torso. Breathe out as you perform this movement. Tip: Be sure to use a slow and controlled motion. Concentrate on using your abs to move the weight while relaxing your legs and feet.", "After a second pause, slowly return to the starting position as you breathe in.", "Repeat the movement for the prescribed amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Ab_Crunch_Machine/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Ab_Crunch_Machine/1.jpg"], "force": "pull", "nameEs": "Ab Crunch Machine"}, {"id": "Exercise_Ball_Crunch", "name": "Exercise Ball Crunch", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "exercise ball", "equipmentEs": "Pelota", "muscles": ["abdominals"], "musclesEs": ["Abdominales"], "secondaryEs": [], "instructions": ["Lie on an exercise ball with your lower back curvature pressed against the spherical surface of the ball. Your feet should be bent at the knee and pressed firmly against the floor. The upper torso should be hanging off the top of the ball. The arms should either be kept alongside the body or crossed on top of your chest as these positions avoid neck strains (as opposed to the hands behind the back of the head position).", "Lower your torso into a stretch position keeping the neck stationary at all times. This will be your starting position.", "With the hips stationary, flex the waist by contracting the abdominals and curl the shoulders and trunk upward until you feel a nice contraction on your abdominals. The arms should simply slide up the side of your legs if you have them at the side or just stay on top of your chest if you have them crossed. The lower back should always stay in contact with the ball. Exhale as you perform this movement and hold the contraction for a second.", "As you inhale, go back to the starting position.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Exercise_Ball_Crunch/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Exercise_Ball_Crunch/1.jpg"], "force": "pull", "nameEs": "Exercise Ball Crunch"}, {"id": "Push-Up_Wide", "name": "Push-Up Wide", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Abdominales", "Hombros", "Tríceps"], "instructions": ["With your hands wide apart, support your body on your toes and hands in a plank position. Your elbows should be extended and your body straight. Do not allow your hips to sag. This will be your starting position.", "To begin, allow the elbows to flex, lowering your chest to the floor as you inhale.", "Using your pectoral muscles, press your upper body back up to the starting position by extending the elbows. Exhale as you perform this step.", "After pausing at the contracted position, repeat the movement for the prescribed amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Push-Up_Wide/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Push-Up_Wide/1.jpg"], "force": null, "nameEs": "Push-Up Wide"}, {"id": "Bench_Dips", "name": "Bench Dips", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["triceps"], "musclesEs": ["Tríceps"], "secondaryEs": ["Pecho", "Hombros"], "instructions": ["For this exercise you will need to place a bench behind your back. With the bench perpendicular to your body, and while looking away from it, hold on to the bench on its edge with the hands fully extended, separated at shoulder width. The legs will be extended forward, bent at the waist and perpendicular to your torso. This will be your starting position.", "Slowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.", "Using your triceps to bring your torso up again, lift yourself back to the starting position.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bench_Dips/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bench_Dips/1.jpg"], "force": "push", "nameEs": "Fondos en banco"}, {"id": "Seated_Calf_Raise", "name": "Seated Calf Raise", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["calves"], "musclesEs": ["Pantorrillas"], "secondaryEs": [], "instructions": ["Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.", "Place your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.", "Lift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.", "Slowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement.", "Raise the heels by extending the ankles as high as possible as you contract the calves and breathe out. Hold the top contraction for a second.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Seated_Calf_Raise/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Seated_Calf_Raise/1.jpg"], "force": "push", "nameEs": "Elevación de talones sentado"}, {"id": "Standing_Dumbbell_Calf_Raise", "name": "Standing Dumbbell Calf Raise", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["calves"], "musclesEs": ["Pantorrillas"], "secondaryEs": [], "instructions": ["Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor. This will be your starting position.", "With the toes pointing either straight (to hit all parts equally), inwards (for emphasis on the outer head) or outwards (for emphasis on the inner head), raise the heels off the floor as you exhale by contracting the calves. Hold the top contraction for a second.", "As you inhale, go back to the starting position by slowly lowering the heels.", "Repeat for the recommended amount of times."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Dumbbell_Calf_Raise/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Dumbbell_Calf_Raise/1.jpg"], "force": "push", "nameEs": "Standing Dumbbell Calf Raise"}, {"id": "Glute_Ham_Raise", "name": "Glute Ham Raise", "level": "intermediate", "levelEs": "Intermedio", "category": "powerlifting", "categoryEs": "Powerlifting", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["hamstrings"], "musclesEs": ["Isquiotibiales"], "secondaryEs": ["Pantorrillas", "Glúteos"], "instructions": ["Begin by adjusting the equipment to fit your body. Place your feet against the footplate in between the rollers as you lie facedown. Your knees should be just behind the pad.", "Start from the bottom of the movement. Keep your back arched as you begin the movement by flexing the knees. Drive your toes into the foot plate as you do so. Keep your upper body straight, and continue until your body is upright.", "Return to the starting position, keeping your descent under control."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Glute_Ham_Raise/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Glute_Ham_Raise/1.jpg"], "force": "pull", "nameEs": "Glute Ham Raise"}, {"id": "Band_Pull_Apart", "name": "Band Pull Apart", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "bands", "equipmentEs": "Banda", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Espalda media", "Trapecios"], "instructions": ["Begin with your arms extended straight out in front of you, holding the band with both hands.", "Initiate the movement by performing a reverse fly motion, moving your hands out laterally to your sides.", "Keep your elbows extended as you perform the movement, bringing the band to your chest. Ensure that you keep your shoulders back during the exercise.", "Pause as you complete the movement, returning to the starting position under control."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Band_Pull_Apart/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Band_Pull_Apart/1.jpg"], "force": "pull", "nameEs": "Band Pull Apart"}, {"id": "Rowing_Stationary", "name": "Rowing, Stationary", "level": "intermediate", "levelEs": "Intermedio", "category": "cardio", "categoryEs": "Cardio", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Bíceps", "Pantorrillas", "Glúteos", "Isquiotibiales", "Zona lumbar", "Espalda media"], "instructions": ["To begin, seat yourself on the rower. Make sure that your heels are resting comfortably against the base of the foot pedals and that the straps are secured. Select the program that you wish to use, if applicable. Sit up straight and bend forward at the hips.", "There are three phases of movement when using a rower. The first phase is when you come forward on the rower. Your knees are bent and against your chest. Your upper body is leaning slightly forward while still maintaining good posture. Next, push against the foot pedals and extend your legs while bringing your hands to your upper abdominal area, squeezing your shoulders back as you do so. To avoid straining your back, use primarily your leg and hip muscles.", "The recovery phase simply involves straightening your arms, bending the knees, and bringing your body forward again as you transition back into the first phase."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Rowing_Stationary/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Rowing_Stationary/1.jpg"], "force": null, "nameEs": "Rowing, Stationary"}, {"id": "Elliptical_Trainer", "name": "Elliptical Trainer", "level": "intermediate", "levelEs": "Intermedio", "category": "cardio", "categoryEs": "Cardio", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Glúteos", "Isquiotibiales"], "instructions": ["To begin, step onto the elliptical and select the desired option from the menu. Most ellipticals have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.", "The handles can be used to monitor your heart rate to help you stay at an appropriate intensity."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Elliptical_Trainer/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Elliptical_Trainer/1.jpg"], "force": null, "nameEs": "Elliptical Trainer"}, {"id": "Childs_Pose", "name": "Child's Pose", "level": "beginner", "levelEs": "Inicio", "category": "stretching", "categoryEs": "Movilidad", "equipment": null, "equipmentEs": "Ninguno", "muscles": ["lower back"], "musclesEs": ["Zona lumbar"], "secondaryEs": ["Glúteos", "Espalda media"], "instructions": ["Get on your hands and knees, walk your hands in front of you.", "Lower your buttocks down to sit on your heels. Let your arms drag along the floor as you sit back to stretch your entire spine.", "Once you settle onto your heels, bring your hands next to your feet and relax. \"breathe\" into your back. Rest your forehead on the floor. Avoid this position if you have knee problems."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Childs_Pose/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Childs_Pose/1.jpg"], "force": "static", "nameEs": "Postura del niño"}, {"id": "Cat_Stretch", "name": "Cat Stretch", "level": "beginner", "levelEs": "Inicio", "category": "stretching", "categoryEs": "Movilidad", "equipment": null, "equipmentEs": "Ninguno", "muscles": ["lower back"], "musclesEs": ["Zona lumbar"], "secondaryEs": ["Espalda media", "Trapecios"], "instructions": ["Position yourself on the floor on your hands and knees.", "Pull your belly in and round your spine, lower back, shoulders, and neck, letting your head drop.", "Hold for 15 seconds."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cat_Stretch/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cat_Stretch/1.jpg"], "force": "static", "nameEs": "Estiramiento del gato"}, {"id": "Worlds_Greatest_Stretch", "name": "World's Greatest Stretch", "level": "intermediate", "levelEs": "Intermedio", "category": "stretching", "categoryEs": "Movilidad", "equipment": null, "equipmentEs": "Ninguno", "muscles": ["hamstrings"], "musclesEs": ["Isquiotibiales"], "secondaryEs": ["Pantorrillas", "Glúteos", "Cuádriceps"], "instructions": ["This is a three-part stretch. Begin by lunging forward, with your front foot flat on the ground and on the toes of your back foot. With your knees bent, squat down until your knee is almost touching the ground. Keep your torso erect, and hold this position for 10-20 seconds.", "Now, place the arm on the same side as your front leg on the ground, with the elbow next to the foot. Your other hand should be placed on the ground, parallel to your lead leg, to help support you during this portion of the stretch.", "After 10-20 seconds, place your hands on either side of your front foot. Raise the toes of the front foot off of the ground, and straighten your leg. You may need to reposition your rear leg to do so. Hold for 10-20 seconds, and then repeat the entire sequence for the other side."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Worlds_Greatest_Stretch/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Worlds_Greatest_Stretch/1.jpg"], "force": "static", "nameEs": "World's Greatest Stretch"}, {"id": "Alternating_Cable_Shoulder_Press", "name": "Alternating Cable Shoulder Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Tríceps"], "instructions": ["Move the cables to the bottom of the tower and select an appropriate weight.", "Grasp the cables and hold them at shoulder height, palms facing forward. This will be your starting position.", "Keeping your head and chest up, extend through the elbow to press one side directly over head.", "After pausing at the top, return to the starting position and repeat on the opposite side."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternating_Cable_Shoulder_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternating_Cable_Shoulder_Press/1.jpg"], "force": "push", "nameEs": "Alternating Cable Shoulder Press"}, {"id": "Alternating_Floor_Press", "name": "Alternating Floor Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "kettlebells", "equipmentEs": "Pesa rusa", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Abdominales", "Hombros", "Tríceps"], "instructions": ["Lie on the floor with two kettlebells next to your shoulders.", "Position one in place on your chest and then the other, gripping the kettlebells on the handle with the palms facing forward.", "Extend both arms, so that the kettlebells are being held above your chest. Lower one kettlebell, bringing it to your chest and turn the wrist in the direction of the locked out kettlebell.", "Raise the kettlebell and repeat on the opposite side."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternating_Floor_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternating_Floor_Press/1.jpg"], "force": "push", "nameEs": "Alternating Floor Press"}, {"id": "Alternating_Kettlebell_Press", "name": "Alternating Kettlebell Press", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "kettlebells", "equipmentEs": "Pesa rusa", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Tríceps"], "instructions": ["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so.", "Press one directly overhead by extending through the elbow, turning it so the palm faces forward while holding the other kettlebell stationary .", "Lower the pressed kettlebell to the starting position and immediately press with your other arm."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternating_Kettlebell_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternating_Kettlebell_Press/1.jpg"], "force": "push", "nameEs": "Alternating Kettlebell Press"}, {"id": "Alternating_Kettlebell_Row", "name": "Alternating Kettlebell Row", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "kettlebells", "equipmentEs": "Pesa rusa", "muscles": ["middle back"], "musclesEs": ["Espalda media"], "secondaryEs": ["Bíceps", "Dorsales"], "instructions": ["Place two kettlebells in front of your feet. Bend your knees slightly and push your butt out as much as possible. As you bend over to get into the starting position grab both kettlebells by the handles.", "Pull one kettlebell off of the floor while holding on to the other kettlebell. Retract the shoulder blade of the working side, as you flex the elbow, drawing the kettlebell towards your stomach or rib cage.", "Lower the kettlebell in the working arm and repeat with your other arm."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternating_Kettlebell_Row/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternating_Kettlebell_Row/1.jpg"], "force": "pull", "nameEs": "Alternating Kettlebell Row"}, {"id": "Anti-Gravity_Press", "name": "Anti-Gravity Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Espalda media", "Trapecios", "Tríceps"], "instructions": ["Place a bar on the ground behind the head of an incline bench.", "Lay on the bench face down. With a pronated grip, pick the barbell up from the floor. Flex the elbows, performing a reverse curl to bring the bar near your chest. This will be your starting position.", "To begin, press the barbell out in front of your head by extending your elbows. Keep your arms parallel to the ground throughout the movement.", "Return to the starting position and repeat to complete the set."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Anti-Gravity_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Anti-Gravity_Press/1.jpg"], "force": "push", "nameEs": "Anti-Gravity Press"}, {"id": "Band_Assisted_Pull-Up", "name": "Band Assisted Pull-Up", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "other", "equipmentEs": "Otro", "muscles": ["lats"], "musclesEs": ["Dorsales"], "secondaryEs": ["Abdominales", "Antebrazos", "Espalda media"], "instructions": ["Choke the band around the center of the pullup bar. You can use different bands to provide varying levels of assistance.", "Pull the end of the band down, and place one bent knee into the loop, ensuring it won't slip out. Take a medium to wide grip on the bar. This will be your starting position.", "Pull yourself upward by contracting the lats as you flex the elbow. The elbow should be driven to your side. Pull to the front, attempting to get your chin over the bar. Avoid swinging or jerking movements.", "After a brief pause, return to the starting position."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Band_Assisted_Pull-Up/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Band_Assisted_Pull-Up/1.jpg"], "force": null, "nameEs": "Band Assisted Pull-Up"}, {"id": "Barbell_Full_Squat", "name": "Barbell Full Squat", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Glúteos", "Isquiotibiales", "Zona lumbar"], "instructions": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just above shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and position your legs using a shoulder-width medium stance with the toes slightly pointed out. Keep your head up at all times and maintain a straight back. This will be your starting position.", "Begin to slowly lower the bar by bending the knees and sitting back with your hips as you maintain a straight posture with the head up. Continue down until your hamstrings are on your calves. Inhale as you perform this portion of the movement.", "Begin to raise the bar as you exhale by pushing the floor with the heel or middle of your foot as you straighten the legs and extend the hips to go back to the starting position.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Full_Squat/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Full_Squat/1.jpg"], "force": "push", "nameEs": "Barbell Full Squat"}, {"id": "Barbell_Guillotine_Bench_Press", "name": "Barbell Guillotine Bench Press", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Hombros", "Tríceps"], "instructions": ["Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over your neck with your arms locked. This will be your starting position.", "As you breathe in, bring the bar down slowly until it is about 1 inch from your neck.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions.", "When you are done, place the bar back in the rack."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Guillotine_Bench_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Guillotine_Bench_Press/1.jpg"], "force": "push", "nameEs": "Barbell Guillotine Bench Press"}, {"id": "Barbell_Hack_Squat", "name": "Barbell Hack Squat", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Antebrazos", "Isquiotibiales"], "instructions": ["Stand up straight while holding a barbell behind you at arms length and your feet at shoulder width. Tip: A shoulder width grip is best with the palms of your hands facing back. You can use wrist wraps for this exercise for a better grip. This will be your starting position.", "While keeping your head and eyes up and back straight, squat until your upper thighs are parallel to the floor. Breathe in as you slowly go down.", "Pressing mainly with the heel of the foot and squeezing the thighs, go back up as you breathe out.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Hack_Squat/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Hack_Squat/1.jpg"], "force": "push", "nameEs": "Barbell Hack Squat"}, {"id": "Barbell_Incline_Bench_Press_-_Medium_Grip", "name": "Barbell Incline Bench Press - Medium Grip", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Hombros", "Tríceps"], "instructions": ["Lie back on an incline bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.", "As you breathe in, come down slowly until you feel the bar on you upper chest.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly again. Tip: it should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions.", "When you are done, place the bar back in the rack."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Incline_Bench_Press_-_Medium_Grip/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Incline_Bench_Press_-_Medium_Grip/1.jpg"], "force": "push", "nameEs": "Barbell Incline Bench Press - Medium Grip"}, {"id": "Barbell_Rear_Delt_Row", "name": "Barbell Rear Delt Row", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Bíceps", "Dorsales", "Espalda media"], "instructions": ["Stand up straight while holding a barbell using a wide (higher than shoulder width) and overhand (palms facing your body) grip.", "Bend knees slightly and bend over as you keep the natural arch of your back. Let the arms hang in front of you as they hold the bar. Once your torso is parallel to the floor, flare the elbows out and away from your body. Tip: Your torso and your arms should resemble the letter \"T\". Now you are ready to begin the exercise.", "While keeping the upper arms perpendicular to the torso, pull the barbell up towards your upper chest as you squeeze the rear delts and you breathe out. Tip: When performed correctly, this exercise should resemble a bench press in reverse. Also, refrain from using your biceps to do the work. Focus on targeting the rear delts; the arms should only act as hooks.", "Slowly go back to the initial position as you breathe in.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Rear_Delt_Row/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Rear_Delt_Row/1.jpg"], "force": "pull", "nameEs": "Barbell Rear Delt Row"}, {"id": "Barbell_Shoulder_Press", "name": "Barbell Shoulder Press", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Pecho", "Tríceps"], "instructions": ["Sit on a bench with back support in a squat rack. Position a barbell at a height that is just above your head. Grab the barbell with a pronated grip (palms facing forward).", "Once you pick up the barbell with the correct grip width, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.", "Lower the bar down to the shoulders slowly as you inhale.", "Lift the bar back up to the starting position as you exhale.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Shoulder_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Shoulder_Press/1.jpg"], "force": "push", "nameEs": "Barbell Shoulder Press"}, {"id": "Barbell_Side_Split_Squat", "name": "Barbell Side Split Squat", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Isquiotibiales", "Zona lumbar"], "instructions": ["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be placed wide apart with the foot of the lead leg angled out to the side. This will be your starting position.", "Lower your body towards the side of your angled foot by bending the knee and hip of your lead leg and while keeping the opposite leg only slightly bent. Breathe in as you lower your body.", "Return to the starting position by extending the hip and knee of the lead leg. Breathe out as you perform this movement.", "After performing the recommended amount of reps, repeat the movement with the opposite leg."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Side_Split_Squat/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Side_Split_Squat/1.jpg"], "force": "push", "nameEs": "Barbell Side Split Squat"}, {"id": "Barbell_Walking_Lunge", "name": "Barbell Walking Lunge", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Glúteos", "Isquiotibiales"], "instructions": ["Begin standing with your feet shoulder width apart and a barbell across your upper back.", "Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.", "Drive through the heel of your lead foot and extend both knees to raise yourself back up.", "Step forward with your rear foot, repeating the lunge on the opposite leg."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Walking_Lunge/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Walking_Lunge/1.jpg"], "force": "push", "nameEs": "Barbell Walking Lunge"}, {"id": "Bench_Press_-_With_Bands", "name": "Bench Press - With Bands", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "bands", "equipmentEs": "Banda", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Hombros", "Tríceps"], "instructions": ["Using a flat bench secure a band under the leg of the bench that is nearest to your head.", "Once the band is secure, grab it by both handles and lie down on the bench.", "Extend your arms so that you are holding the band handles in front of you at shoulder width.", "Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.", "Bring down the handles slowly until your elbow forms a 90 degree angle. Keep full control at all times.", "As you breathe out, bring the handles up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions of your training program."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bench_Press_-_With_Bands/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bench_Press_-_With_Bands/1.jpg"], "force": "push", "nameEs": "Bench Press - With Bands"}, {"id": "Bent_Over_One-Arm_Long_Bar_Row", "name": "Bent Over One-Arm Long Bar Row", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["middle back"], "musclesEs": ["Espalda media"], "secondaryEs": ["Bíceps", "Dorsales", "Zona lumbar", "Trapecios"], "instructions": ["Put weight on one of the ends of an Olympic barbell. Make sure that you either place the other end of the barbell in the corner of two walls; or put a heavy object on the ground so the barbell cannot slide backward.", "Bend forward until your torso is as close to parallel with the floor as you can and keep your knees slightly bent.", "Now grab the bar with one arm just behind the plates on the side where the weight was placed and put your other hand on your knee. This will be your starting position.", "Pull the bar straight up with your elbow in (to maximize back stimulation) until the plates touch your lower chest. Squeeze the back muscles as you lift the weight up and hold for a second at the top of the movement. Breathe out as you lift the weight. Tip: Do not allow for any swinging of the torso. Only the arm should move.", "Slowly lower the bar to the starting position getting a nice stretch on the lats. Tip: Do not let the plates touch the floor. To ensure the best range of motion, I recommend using small plates (25-lb ones) as opposed to larger plates (like 35-45lb ones).", "Repeat for the recommended amount of repetitions and switch arms."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_One-Arm_Long_Bar_Row/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_One-Arm_Long_Bar_Row/1.jpg"], "force": "pull", "nameEs": "Bent Over One-Arm Long Bar Row"}, {"id": "Bent_Over_Two-Arm_Long_Bar_Row", "name": "Bent Over Two-Arm Long Bar Row", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["middle back"], "musclesEs": ["Espalda media"], "secondaryEs": ["Bíceps", "Dorsales"], "instructions": ["Put weight on one of the ends of an Olympic barbell. Make sure that you either place the other end of the barbell in the corner of two walls; or put a heavy object on the ground so the barbell cannot slide backward.", "Bend forward until your torso is as close to parallel with the floor as you can and keep your knees slightly bent.", "Now grab the bar with both arms just behind the plates on the side where the weight was placed and put your other hand on your knee. This will be your starting position.", "Pull the bar straight up with your elbows in (to maximize back stimulation) until the plates touch your lower chest. Squeeze the back muscles as you lift the weight up and hold for a second at the top of the movement. Breathe out as you lift the weight. Tip: Use a stirrup or double handle cable attachment by hooking it under the end of the bar.", "Slowly lower the bar to the starting position getting a nice stretch on the lats. Tip: Do not let the plates touch the floor. To ensure the best range of motion, I recommend using small plates (25-lb ones) as opposed to larger plates (like 35-45lb ones).", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Two-Arm_Long_Bar_Row/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Two-Arm_Long_Bar_Row/1.jpg"], "force": "pull", "nameEs": "Bent Over Two-Arm Long Bar Row"}, {"id": "Bent_Over_Two-Dumbbell_Row_With_Palms_In", "name": "Bent Over Two-Dumbbell Row With Palms In", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["middle back"], "musclesEs": ["Espalda media"], "secondaryEs": ["Bíceps", "Dorsales"], "instructions": ["With a dumbbell in each hand (palms facing each other), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.", "While keeping the torso stationary, lift the dumbbells to your side as you breathe out, squeezing your shoulder blades together. On the top contracted position, squeeze the back muscles and hold for a second.", "Slowly lower the weight again to the starting position as you inhale.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Two-Dumbbell_Row_With_Palms_In/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Two-Dumbbell_Row_With_Palms_In/1.jpg"], "force": "pull", "nameEs": "Bent Over Two-Dumbbell Row With Palms In"}, {"id": "Body_Tricep_Press", "name": "Body Tricep Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["triceps"], "musclesEs": ["Tríceps"], "secondaryEs": [], "instructions": ["Position a bar in a rack at chest height.", "Standing, take a shoulder width grip on the bar and step a yard or two back, feet together and arms extended so that you are leaning on the bar. This will be your starting position.", "Begin by flexing the elbow, lowering yourself towards the bar.", "Pause, and then reverse the motion by extending the elbows.", "Progress from bodyweight by adding chains over your shoulders."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Body_Tricep_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Body_Tricep_Press/1.jpg"], "force": "push", "nameEs": "Body Tricep Press"}, {"id": "Bodyweight_Mid_Row", "name": "Bodyweight Mid Row", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "other", "equipmentEs": "Otro", "muscles": ["middle back"], "musclesEs": ["Espalda media"], "secondaryEs": ["Bíceps", "Dorsales"], "instructions": ["Begin by taking a medium to wide grip on a pull-up apparatus with your palms facing away from you. From a hanging position, tuck your knees to your chest, leaning back and getting your legs over your side of the pull-up apparatus. This will be your starting position.", "Beginning with your arms straight, flex the elbows and retract the shoulder blades to raise your body up until your legs contact the pull-up apparatus.", "After a brief pause, return to the starting position."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bodyweight_Mid_Row/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bodyweight_Mid_Row/1.jpg"], "force": "pull", "nameEs": "Bodyweight Mid Row"}, {"id": "Bradford_Rocky_Presses", "name": "Bradford/Rocky Presses", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Tríceps"], "instructions": ["Sit on a Military Press Bench with a bar at shoulder level with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down. This is your starting position.", "Once you pick up the barbell with the correct grip, lift the bar up over your head by locking your arms.", "Now lower the bar down to the back of the head slowly as you inhale.", "Lift the bar back up to the starting position as you exhale.", "Lower the bar down to the starting position slowly as you inhale. This is one repetition.", "Alternate in this manner until you complete the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bradford_Rocky_Presses/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bradford_Rocky_Presses/1.jpg"], "force": "push", "nameEs": "Bradford/Rocky Presses"}, {"id": "Cable_Chest_Press", "name": "Cable Chest Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Hombros", "Tríceps"], "instructions": ["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.", "Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.", "After pausing at full extension, return to th starting position, keeping tension on the cables.", "You can also execute this movement with your back off the pad, at an incline or decline, or alternate hands."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Chest_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Chest_Press/1.jpg"], "force": "push", "nameEs": "Cable Chest Press"}, {"id": "Cable_Deadlifts", "name": "Cable Deadlifts", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Antebrazos", "Glúteos", "Isquiotibiales", "Zona lumbar"], "instructions": ["Move the cables to the bottom of the towers and select an appropriate weight. Stand directly in between the uprights.", "To begin, squat down be flexing your hips and knees until you can reach the handles.", "After grasping them, begin your ascent. Driving through your heels extend your hips and knees keeping your hands hanging at your side. Keep your head and chest up throughout the movement.", "After reaching a full standing position, Return to the starting position and repeat."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Deadlifts/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Deadlifts/1.jpg"], "force": "pull", "nameEs": "Cable Deadlifts"}, {"id": "Cable_Rope_Rear-Delt_Rows", "name": "Cable Rope Rear-Delt Rows", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Bíceps", "Espalda media"], "instructions": ["Sit in the same position on a low pulley row station as you would if you were doing seated cable rows for the back.", "Attach a rope to the pulley and grasp it with an overhand grip. Your arms should be extended and parallel to the floor with the elbows flared out.", "Keep your lower back upright and slide your hips back so that your knees are slightly bent. This will be your starting position.", "Pull the cable attachment towards your upper chest, just below the neck, as you keep your elbows up and out to the sides. Continue this motion as you exhale until the elbows travel slightly behind the back. Tip: Keep your upper arms horizontal, perpendicular to the torso and parallel to the floor throughout the motion.", "Go back to the initial position where the arms are extended and the shoulders are stretched forward. Inhale as you perform this portion of the movement.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Rope_Rear-Delt_Rows/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Rope_Rear-Delt_Rows/1.jpg"], "force": "pull", "nameEs": "Cable Rope Rear-Delt Rows"}, {"id": "Cable_Shoulder_Press", "name": "Cable Shoulder Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Tríceps"], "instructions": ["Move the cables to the bottom of the towers and select an appropriate weight.", "Stand directly in between the uprights. Grasp the cables and hold them at shoulder height, palms facing forward. This will be your starting position.", "Keeping your head and chest up, extend through the elbow to press the handles directly over head.", "After pausing at the top, return to the starting position and repeat."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Shoulder_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Shoulder_Press/1.jpg"], "force": "push", "nameEs": "Cable Shoulder Press"}, {"id": "Calf_Press", "name": "Calf Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["calves"], "musclesEs": ["Pantorrillas"], "secondaryEs": [], "instructions": ["Adjust the seat so that your legs are only slightly bent in the start position. The balls of your feet should be firmly on the platform.", "Select an appropriate weight, and grasp the handles. This will be your starting position.", "Straighten the legs by extending the knees, just barely lifting the weight from the stack. Your ankle should be fully flexed, toes pointing up. Execute the movement by pressing downward through the balls of your feet as far as possible.", "After a brief pause, reverse the motion and repeat."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Calf_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Calf_Press/1.jpg"], "force": "push", "nameEs": "Calf Press"}, {"id": "Calf_Press_On_The_Leg_Press_Machine", "name": "Calf Press On The Leg Press Machine", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["calves"], "musclesEs": ["Pantorrillas"], "secondaryEs": [], "instructions": ["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance.", "Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you without locking your knees. (Note: In some leg press units you can leave the safety bars on for increased safety. If your leg press unit allows for this, then this is the preferred method of performing the exercise.) Your torso and the legs should make perfect 90-degree angle. Now carefully place your toes and balls of your feet on the lower portion of the platform with the heels extending off. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.", "Press on the platform by raising your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.", "Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Calf_Press_On_The_Leg_Press_Machine/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Calf_Press_On_The_Leg_Press_Machine/1.jpg"], "force": "push", "nameEs": "Calf Press On The Leg Press Machine"}, {"id": "Chair_Squat", "name": "Chair Squat", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "machine", "equipmentEs": "Máquina", "muscles": ["quadriceps"], "musclesEs": ["Cuádriceps"], "secondaryEs": ["Pantorrillas", "Glúteos", "Isquiotibiales"], "instructions": ["To begin, first set the bar to a position that best matches your height. Once the bar is loaded, step under it and position it across the back of your shoulders.", "Take the bar with your hands facing forward, unlock it and lift it off the rack by extending your legs.", "Move your feet forward about 18 inches in front of the bar. Position your legs using a shoulder width stance with the toes slightly pointed out. Look forward at all times and maintain a neutral or slightly arched spine. This will be your starting position.", "Slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper and lower leg breaks 90 degrees.", "Begin to raise the bar as you exhale by pushing the floor with the heels of your feet, extending the knees and returning to the starting position.", "Repeat for the recommended amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Chair_Squat/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Chair_Squat/1.jpg"], "force": "push", "nameEs": "Chair Squat"}, {"id": "Clean_and_Press", "name": "Clean and Press", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Abdominales", "Pantorrillas", "Glúteos", "Isquiotibiales", "Zona lumbar", "Espalda media", "Cuádriceps", "Hombros", "Trapecios", "Tríceps"], "instructions": ["Assume a shoulder-width stance, with knees inside the arms. Now while keeping the back flat, bend at the knees and hips so that you can grab the bar with the arms fully extended and a pronated grip that is slightly wider than shoulder width. Point the elbows out to sides. The bar should be close to the shins. Position the shoulders over or slightly ahead of the bar. Establish a flat back posture. This will be your starting position.", "Begin to pull the bar by extending the knees. Move your hips forward and raise the shoulders at the same rate while keeping the angle of the back constant; continue to lift the bar straight up while keeping it close to your body.", "As the bar passes the knee, extend at the ankles, knees, and hips forcefully, similar to a jumping motion. As you do so, continue to guide the bar with your hands, shrugging your shoulders and using the momentum from your movement to pull the bar as high as possible. The bar should travel close to your body, and you should keep your elbows out.", "At maximum elevation, your feet should clear the floor and you should start to pull yourself under the bar. The mechanics of this could change slightly, depending on the weight used. You should descend into a squatting position as you pull yourself under the bar.", "As the bar hits terminal height, rotate your elbows around and under the bar. Rack the bar across the front of the shoulders while keeping the torso erect and flexing the hips and knees to absorb the weight of the bar.", "Stand to full height, holding the bar in the clean position.", "Without moving your feet, press the bar overhead as you exhale. Lower the bar under control ."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Clean_and_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Clean_and_Press/1.jpg"], "force": "push", "nameEs": "Clean and Press"}, {"id": "Clock_Push-Up", "name": "Clock Push-Up", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["chest"], "musclesEs": ["Pecho"], "secondaryEs": ["Hombros", "Tríceps"], "instructions": ["Move into a prone position on the floor, supporting your weight on your hands and toes.", "Your arms should be fully extended with the hands around shoulder width. Keep your body straight throughout the movement. This will be your starting position.", "Descend by flexing at the elbow, lowering your chest toward the ground.", "At the bottom, reverse the motion by pushing yourself up through elbow extension as quickly as possible until you are air borne. Aim to \"jump\" 12-18 inches to one side.", "As you accelerate up, move your outside foot away from your direction of travel. Leaving the ground, shift your body about 30 degrees for the next repetition.", "Return to the starting position and repeat the exercise, working all the way around until you are back where you started."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Clock_Push-Up/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Clock_Push-Up/1.jpg"], "force": "push", "nameEs": "Clock Push-Up"}, {"id": "Close-Grip_Barbell_Bench_Press", "name": "Close-Grip Barbell Bench Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "barbell", "equipmentEs": "Barra", "muscles": ["triceps"], "musclesEs": ["Tríceps"], "secondaryEs": ["Pecho", "Hombros"], "instructions": ["Lie back on a flat bench. Using a close grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.", "As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that - as opposed to a regular bench press - you keep the elbows close to the torso at all times in order to maximize triceps involvement.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions.", "When you are done, place the bar back in the rack."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_Barbell_Bench_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_Barbell_Bench_Press/1.jpg"], "force": "push", "nameEs": "Close-Grip Barbell Bench Press"}, {"id": "Close-Grip_Dumbbell_Press", "name": "Close-Grip Dumbbell Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["triceps"], "musclesEs": ["Tríceps"], "secondaryEs": ["Pecho", "Hombros"], "instructions": ["Place a dumbbell standing up on a flat bench.", "Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench with only your shoulders lying on the surface. Hips should be below the bench and your legs bent with your feet firmly on the floor.", "Grasp the dumbbell with both hands and hold it straight over your chest at arm's length. Both palms should be pressing against the underside of the sides of the dumbbell. This will be your starting position.", "Initiate the movement by lowering the dumbbell to your chest.", "Return to the starting position by extending the elbows."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_Dumbbell_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_Dumbbell_Press/1.jpg"], "force": "push", "nameEs": "Close-Grip Dumbbell Press"}, {"id": "Close-Grip_EZ-Bar_Press", "name": "Close-Grip EZ-Bar Press", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "e-z curl bar", "equipmentEs": "Barra EZ", "muscles": ["triceps"], "musclesEs": ["Tríceps"], "secondaryEs": ["Pecho", "Hombros"], "instructions": ["Lie on a flat bench with an EZ bar loaded to an appropriate weight.", "Using a narrow grip lift the bar and hold it straight over your torso with your elbows in. The arms should be perpendicular to the floor. This will be your starting position.", "Now lower the bar down to your lower chest as you breathe in. Keep the elbows in as you perform this movement.", "Using the triceps to push the bar back up, press it back to the starting position by extending the elbows as you exhale.", "Repeat."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_EZ-Bar_Press/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_EZ-Bar_Press/1.jpg"], "force": "push", "nameEs": "Close-Grip EZ-Bar Press"}, {"id": "Close-Grip_Front_Lat_Pulldown", "name": "Close-Grip Front Lat Pulldown", "level": "beginner", "levelEs": "Inicio", "category": "strength", "categoryEs": "Fuerza", "equipment": "cable", "equipmentEs": "Polea", "muscles": ["lats"], "musclesEs": ["Dorsales"], "secondaryEs": ["Bíceps", "Espalda media", "Hombros"], "instructions": ["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.", "As you have both arms extended in front of you - while holding the bar at the chosen grip width - bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.", "As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary (only the arms should move). The forearms should do no other work except for holding the bar; therefore do not try to pull the bar down using the forearms.", "After a second in the contracted position, while squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.", "6. Repeat this motion for the prescribed amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_Front_Lat_Pulldown/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_Front_Lat_Pulldown/1.jpg"], "force": "pull", "nameEs": "Close-Grip Front Lat Pulldown"}, {"id": "Close-Grip_Push-Up_off_of_a_Dumbbell", "name": "Close-Grip Push-Up off of a Dumbbell", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "body only", "equipmentEs": "Peso corporal", "muscles": ["triceps"], "musclesEs": ["Tríceps"], "secondaryEs": ["Abdominales", "Pecho", "Hombros"], "instructions": ["Lie on the floor and place your hands on an upright dumbbell. Supporting your weight on your toes and hands, keep your torso rigid and your elbows in with your arms straight. This will be your starting position.", "Lower your body, allowing the elbows to flex while you inhale. Keep your body straight, not allowing your hips to rise or sag.", "Press yourself back up to the starting position by extending the elbows. Breathe out as you perform this step.", "After a pause at the contracted position, repeat the movement for the prescribed amount of repetitions."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_Push-Up_off_of_a_Dumbbell/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Close-Grip_Push-Up_off_of_a_Dumbbell/1.jpg"], "force": "push", "nameEs": "Close-Grip Push-Up off of a Dumbbell"}, {"id": "Crossover_Reverse_Lunge", "name": "Crossover Reverse Lunge", "level": "intermediate", "levelEs": "Intermedio", "category": "stretching", "categoryEs": "Movilidad", "equipment": null, "equipmentEs": "Ninguno", "muscles": ["lower back"], "musclesEs": ["Zona lumbar"], "secondaryEs": ["Abdominales", "Abductores", "Glúteos", "Isquiotibiales", "Cuádriceps"], "instructions": ["Stand with your feet shoulder width apart. This will be your starting position.", "Perform a rear lunge by stepping back with one foot and flexing the hips and front knee. As you do so, rotate your torso across the front leg.", "After a brief pause, return to the starting position and repeat on the other side, continuing in an alternating fashion."], "images": ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Crossover_Reverse_Lunge/0.jpg", "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Crossover_Reverse_Lunge/1.jpg"], "force": "pull", "nameEs": "Crossover Reverse Lunge"}, {"id": "Cuban_Press", "name": "Cuban Press", "level": "intermediate", "levelEs": "Intermedio", "category": "strength", "categoryEs": "Fuerza", "equipment": "dumbbell", "equipmentEs": "Mancuernas", "muscles": ["shoulders"], "musclesEs": ["Hombros"], "secondaryEs": ["Trapecios"], "instructions": ["Take a dumbbell in each hand with a pronated grip in a standing position. Raise your upper arms so that they are parallel to the floor, allowing your lower arms to hang in the \"sc function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function toast(msg) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function persist() {
  store.set("nb_role", state.role);
  store.set("nb_clients", state.clients);
  store.set("nb_profile", state.profile);
  store.set("nb_settings", state.settings);
  store.set("nb_history", state.history);
  store.set("nb_checkins", state.checkins);
  store.set("nb_habits", state.habits);
  store.set("nb_routine_edits", state.routineEdits);
  store.set("nb_routines_custom", state.customRoutines);
  store.set("nb_pin", state.pin || "");
  store.set("nb_pin_hash", state.pinHash || "");
  store.set("nb_pin_salt", state.pinSalt || "");
  store.set("nb_health", state.health);
  store.set("nb_contracts", state.contracts);
  store.set("nb_waiver", state.waiver);
  store.set("nb_payments", state.payments || []);
  store.set("nb_weighins", state.weighins);
  store.set("nb_measures", state.measures);
  store.set("nb_photos", state.photos);
  store.set("nb_notes", state.notes);
  scheduleCloudPush();
}
function cloudUrl() {
  const raw = (state.settings.cloudUrl || "").trim().replace(/\/$/, "");
  if (!raw) return "";
  try {
    const u = new URL(raw);
    if (u.protocol !== "https:") return "";
    return u.origin + u.pathname.replace(/\/$/, "");
  } catch (e) { return ""; }
}
function cloudPayload() {
  return {
    clients: state.clients,
    profile: { name: state.profile.name, plan: state.profile.plan, routine: state.profile.routine },
    history: state.history,
    checkins: state.checkins,
    habits: state.habits,
    weighins: state.weighins,
    measures: state.measures,
    notes: state.notes,
    customRoutines: state.customRoutines,
    routineEdits: state.routineEdits,
    health: state.health,
    waiver: state.waiver ? { name: state.waiver.name, date: state.waiver.date } : null,
    contracts: (state.contracts || []).map((k) => ({ id: k.id, name: k.name, plan: k.plan, date: k.date, flagged: k.flagged })),
    settings: { wa: state.settings.wa, studioKey: state.settings.studioKey, pay: state.settings.pay || {} },
    updatedAt: Date.now()
  };
}
function applyCloud(d) {
  if (!d || typeof d !== "object") return;
  if (d.clients) state.clients = d.clients;
  if (d.history) state.history = d.history;
  if (d.checkins) state.checkins = d.checkins;
  if (d.habits) state.habits = d.habits;
  if (d.weighins) state.weighins = d.weighins;
  if (d.measures) state.measures = d.measures;
  if (d.notes) state.notes = d.notes;
  if (d.customRoutines) state.customRoutines = d.customRoutines;
  if (d.routineEdits) state.routineEdits = d.routineEdits;
  if (d.health) state.health = d.health;
  if (d.waiver && !state.waiver) state.waiver = d.waiver;

function warmupIntro() {
  if (warmupIntro.el) return warmupIntro.el;
  const v = document.createElement("video");
  v.muted = true;
  v.playsInline = true;
  v.setAttribute("playsinline", "");
  v.setAttribute("webkit-playsinline", "");
  v.preload = "auto";
  v.poster = "/intro-poster.jpg";
  v.src = "/intro.mp4?v=3";
  try { v.load(); } catch (e) {}
  warmupIntro.el = v;
  return v;
}
function playIntro() {
  return new Promise((resolve) => {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      resolve();
      return;
    }
    const v = warmupIntro();
    try { v.pause(); v.currentTime = 0; } catch (e) {}
    const host = document.createElement("div");
    host.className = "intro-play";
    host.setAttribute("aria-label", "NiuBision");
    host.appendChild(v);
    (document.body || document.documentElement).appendChild(host);
    let done = false;
    let canSkip = false;
    const finish = () => {
      if (done) return;
      done = true;
      host.classList.add("out");
      setTimeout(() => {
        try { if (v.parentNode === host) host.removeChild(v); host.remove(); } catch (e2) {}
        resolve();
      }, 280);
    };
    setTimeout(() => { canSkip = true; }, 500);
    host.addEventListener("pointerdown", (e) => { if (!canSkip) return; e.preventDefault(); finish(); });
    v.addEventListener("ended", finish, { once: true });
    v.addEventListener("error", () => setTimeout(finish, 300), { once: true });
    const tryPlay = () => { v.play().catch(() => {}); };
    if (v.readyState >= 2) tryPlay();
    else v.addEventListener("canplay", tryPlay, { once: true });
    tryPlay();
    setTimeout(finish, 7000);
  });
}
function bindSplash() {
  const wrap = $("#holdLogo");
  const fill = $("#holdFill");
  const ring = $(".ring circle");
  let hold = 0, ticking = false, raf, gone = false;
  const go = () => {
    if (gone) return;
    gone = true;
    const splash = $("#splash");
    if (splash) splash.classList.add("out");
    playIntro().then(() => {
      state.splash = false;
      store.set("nb_seen_cover", true);
      store.set("nb_seen_intro", true);
      renderGate();
    });
  };
  const step = (on) => {
    ticking = on;
    cancelAnimationFrame(raf);
    const loop = () => {
      hold = Math.max(0, Math.min(100, hold + (ticking ? 2.4 : -3)));
      if (fill) fill.style.width = hold + "%";
      if (ring) ring.style.strokeDashoffset = String(100 - hold);
      wrap.classList.toggle("charged", hold > 20);
      if (hold >= 100) { go(); return; }
      if (hold > 0 || ticking) raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  };
  const down = (e) => { e.preventDefault(); step(true); };
  const up = () => step(false);
  wrap.addEventListener("pointerdown", down);
  window.addEventListener("pointerup", up);
  wrap.addEventListener("click", () => { if (hold < 100) toast("Mantenga pulsado el logo"); });
}

function enterClient(view) {
